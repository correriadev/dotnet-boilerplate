name: CI-CD Walking Skeleton

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"

  deploy-dev:
    name: Deploy Dev (Automático)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy Step Dev
        run: echo "Implantando artefato no ambiente isolado de Dev..."

  deploy-hml:
    name: Deploy Hml (Quality Gate Dynatrace)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - name: Deploy Step Hml
        run: echo "Implantando artefato em Homologação e avaliando Dynatrace SRG..."

  deploy-prod-isolated:
    name: Deploy Prod Isolado (Manual Gate)
    needs: deploy-hml
    runs-on: ubuntu-latest
    environment: prod-isolated
    steps:
      - name: Deploy Step Prod Isolado
        run: echo "Implantando artefato em Produção Isolada (Landing Zone)..."
