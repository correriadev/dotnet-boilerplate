name: Package, Release & Deployment Pipeline

run-name: ${{ inputs.release_version && format('Release {0}', inputs.release_version) || format('Release v1.{0}.0', github.run_number) }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Manual SemVer release version (e.g. 1.2.0). If omitted, automatically calculated.'
        required: false
        type: string

concurrency:
  group: package-release-deploy
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write
  security-events: write
  actions: read

jobs:

  build-and-verify:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Pix.HealthCheck.sln

      - name: Compile Solution (Zero Warning Tolerance)
        run: dotnet build Pix.HealthCheck.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Unit and Architecture Tests with Coverage
        run: dotnet test Pix.HealthCheck.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Evaluate Code Coverage Quality Gate
        shell: pwsh
        run: |
          ./scripts/ci/evaluate-coverage.ps1 -MinLineRate 0.50 -MinBranchRate 0.50 -OutputFile "coverage-summary.md" -FailClosed
          if (Test-Path "coverage-summary.md") {
            Get-Content "coverage-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Evaluate OpenAPI Breaking Changes Contract Guard
        shell: pwsh
        run: |
          ./scripts/ci/evaluate-openapi-diff.ps1 -OutputFile "openapi-diff-summary.md" -FailClosed
          if (Test-Path "openapi-diff-summary.md") {
            Get-Content "openapi-diff-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Evaluate Dependency Vulnerabilities (SCA)
        shell: pwsh
        run: |
          ./scripts/ci/evaluate-dependencies.ps1 -FailClosed
          if (Test-Path "dependencies-summary.md") {
            Get-Content "dependencies-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Evaluate Bicep IaC Security Policies
        shell: pwsh
        run: |
          ./scripts/ci/evaluate-iac.ps1 -FailClosed
          if (Test-Path "iac-summary.md") {
            Get-Content "iac-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Test and Coverage Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: unit-test-and-coverage-results
          path: |
            TestResults/
            coverage-summary.md
            openapi-diff-summary.md
            dependencies-summary.md
            iac-summary.md
          if-no-files-found: ignore
          retention-days: 14

  docker-packaging-and-tag:
    name: Docker Packaging & Git Tag
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      SEMVER_TAG: ${{ steps.create_tag.outputs.SEMVER_TAG }}
      TAG_NAME: ${{ steps.create_tag.outputs.TAG_NAME }}
      IMAGE_DIGEST: ${{ steps.push_image.outputs.IMAGE_DIGEST }}
      MIGRATOR_DIGEST: ${{ steps.push_image.outputs.MIGRATOR_DIGEST }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create and Push Git Tag Early (GMUD/CAB Audit)
        id: create_tag
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Ensure local tags are fully synchronized with remote
          git fetch --tags --force origin 2>/dev/null || true

          SHA="${GITHUB_SHA}"
          echo "Current Commit SHA: $SHA"

          # 2. Check if current commit is already stamped with a SemVer tag
          EXISTING_COMMIT_TAG=$(git tag --points-at "$SHA" "v[0-9]*.[0-9]*.[0-9]*" | head -n 1 || true)
          ALREADY_PUSHED=false

          if [ -n "$EXISTING_COMMIT_TAG" ]; then
            TAG_NAME="$EXISTING_COMMIT_TAG"
            SEMVER_TAG="${TAG_NAME#v}"
            echo "Current commit is already stamped with $TAG_NAME ($SEMVER_TAG). Reusing existing tag."
            ALREADY_PUSHED=true
          elif [ -n "${MANUAL_VERSION:-}" ]; then
            CLEAN_MANUAL="${MANUAL_VERSION#v}"
            if [[ ! "$CLEAN_MANUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "CRITICAL: Provided manual version '$MANUAL_VERSION' is not valid SemVer (expected X.Y.Z)!"
              exit 1
            fi
            SEMVER_TAG="$CLEAN_MANUAL"
            TAG_NAME="v${SEMVER_TAG}"
            echo "Using manual SemVer override: $TAG_NAME"
          else
            # 3. Determine next SemVer version dynamically
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1 || true)
            MAJOR=1
            TARGET_MINOR="${{ github.run_number }}"

            if [ -n "$LATEST_TAG" ]; then
              echo "Highest existing tag in repository: $LATEST_TAG"
              CLEAN_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
              LATEST_MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)

              if [ "$TARGET_MINOR" -le "$LATEST_MINOR" ]; then
                TARGET_MINOR=$((LATEST_MINOR + 1))
              fi
            fi

            SEMVER_TAG="${MAJOR}.${TARGET_MINOR}.0"

            # 4. Atomic collision avoidance against remote origin
            while :; do
              TAG_NAME="v${SEMVER_TAG}"
              echo "Verifying availability of candidate tag $TAG_NAME on remote..."
              REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" 2>/dev/null | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print (peeled != "" ? peeled : direct) }' || true)

              if [ -z "$REMOTE_SHA" ]; then
                echo "Tag $TAG_NAME is available (not found on remote)."
                break
              fi

              if [ "$REMOTE_SHA" = "$SHA" ]; then
                echo "Tag $TAG_NAME already exists on remote and matches current commit $SHA. Reusing."
                ALREADY_PUSHED=true
                break
              fi

              echo "Notice: Tag $TAG_NAME exists on remote but points to a different commit ($REMOTE_SHA). Bumping version..."
              TARGET_MINOR=$((TARGET_MINOR + 1))
              SEMVER_TAG="${MAJOR}.${TARGET_MINOR}.0"
            done
          fi

          # 5. Create and push tag if not already stamped
          if [ "$ALREADY_PUSHED" != "true" ]; then
            echo "Creating annotated tag $TAG_NAME on commit $SHA..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME (Run #${{ github.run_number }})"
            echo "Pushing tag $TAG_NAME to origin..."
            git push origin "$TAG_NAME"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "SEMVER_TAG=$SEMVER_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag finalized: $TAG_NAME (SemVer: $SEMVER_TAG)"

      - name: Azure Login (Zero-Trust Federated OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to Azure Container Registry
        run: az acr login --name acrlabcorreadev

      - name: Build Local Container Images
        env:
          IMAGE_TAG: ${{ github.sha }}
          SEMVER_TAG: ${{ steps.create_tag.outputs.SEMVER_TAG }}
        run: |
          docker build \
            --build-arg VERSION="$SEMVER_TAG" \
            -t "acrlabcorreadev.azurecr.io/pix-healthcheck:$IMAGE_TAG" \
            -t "acrlabcorreadev.azurecr.io/pix-healthcheck:$SEMVER_TAG" .
          docker build \
            -f Dockerfile.migrator \
            --build-arg VERSION="$SEMVER_TAG" \
            -t "acrlabcorreadev.azurecr.io/pix-migrator:$IMAGE_TAG" \
            -t "acrlabcorreadev.azurecr.io/pix-migrator:$SEMVER_TAG" .

      - name: Push Container Images to ACR
        id: push_image
        env:
          IMAGE_TAG: ${{ github.sha }}
          SEMVER_TAG: ${{ steps.create_tag.outputs.SEMVER_TAG }}
        run: |
          docker push "acrlabcorreadev.azurecr.io/pix-healthcheck:$IMAGE_TAG"
          docker push "acrlabcorreadev.azurecr.io/pix-healthcheck:$SEMVER_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "acrlabcorreadev.azurecr.io/pix-healthcheck:$IMAGE_TAG" | cut -d'@' -f2)
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

          docker push "acrlabcorreadev.azurecr.io/pix-migrator:$IMAGE_TAG"
          docker push "acrlabcorreadev.azurecr.io/pix-migrator:$SEMVER_TAG"
          MIGRATOR_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "acrlabcorreadev.azurecr.io/pix-migrator:$IMAGE_TAG" | cut -d'@' -f2)
          echo "MIGRATOR_DIGEST=$MIGRATOR_DIGEST" >> "$GITHUB_OUTPUT"

          echo "SEMVER_TAG=$SEMVER_TAG" >> "$GITHUB_OUTPUT"
          echo "Published API digest: $DIGEST | Migrator digest: $MIGRATOR_DIGEST | SemVer tag: $SEMVER_TAG"

  security-scan-trivy:
    name: Security Vulnerability Scan (Trivy)
    needs: [docker-packaging-and-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure Login (Zero-Trust Federated OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrlabcorreadev

      - name: Security Scan Container Image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: acrlabcorreadev.azurecr.io/pix-healthcheck:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Security Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: 'trivy-results.sarif'

  sbom-generation-syft:
    name: SBOM Generation (Syft SPDX)
    needs: [docker-packaging-and-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure Login (Zero-Trust Federated OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrlabcorreadev

      - name: Generate Software Bill of Materials (SBOM) with Syft
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: acrlabcorreadev.azurecr.io/pix-healthcheck:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'sbom-pix-healthcheck.spdx.json'

      - name: Generate Migrator SBOM with Syft
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: acrlabcorreadev.azurecr.io/pix-migrator:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'sbom-pix-migrator.spdx.json'

      - name: Upload Generated SBOM Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-sboms
          path: |
            sbom-pix-healthcheck.spdx.json
            sbom-pix-migrator.spdx.json
          retention-days: 90

  sign-and-seal-release:
    name: Cosign Signing & Sealed Manifest
    needs: [docker-packaging-and-tag, security-scan-trivy, sbom-generation-syft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Generated SBOM Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-sboms


      - name: Azure Login (Zero-Trust Federated OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrlabcorreadev

      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Cryptographically Sign Container Images (Keyless OIDC)
        env:
          IMAGE_DIGEST: ${{ needs.docker-packaging-and-tag.outputs.IMAGE_DIGEST }}
          MIGRATOR_DIGEST: ${{ needs.docker-packaging-and-tag.outputs.MIGRATOR_DIGEST }}
        run: |
          cosign sign --yes "acrlabcorreadev.azurecr.io/pix-healthcheck@$IMAGE_DIGEST"
          cosign sign --yes "acrlabcorreadev.azurecr.io/pix-migrator@$MIGRATOR_DIGEST"

      - name: Generate Sealed Release Manifest
        id: generate_manifest
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          IMAGE_DIGEST: ${{ needs.docker-packaging-and-tag.outputs.IMAGE_DIGEST }}
          MIGRATOR_DIGEST: ${{ needs.docker-packaging-and-tag.outputs.MIGRATOR_DIGEST }}
          SEMVER_TAG: ${{ needs.docker-packaging-and-tag.outputs.SEMVER_TAG }}
        run: |
          $timestamp = [System.DateTimeOffset]::UtcNow.ToString("o")
          $semver = $env:SEMVER_TAG
          $servicesObj = [PSCustomObject]@{
            api = [PSCustomObject]@{
              image  = "acrlabcorreadev.azurecr.io/pix-healthcheck"
              tag    = $semver
              digest = $env:IMAGE_DIGEST
              sbom   = "sbom-pix-healthcheck.spdx.json"
            }
            migrator = [PSCustomObject]@{
              image  = "acrlabcorreadev.azurecr.io/pix-migrator"
              tag    = $semver
              digest = $env:MIGRATOR_DIGEST
              sbom   = "sbom-pix-migrator.spdx.json"
            }
          }
          $servicesJson = $servicesObj | ConvertTo-Json -Compress -Depth 10
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $hasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($servicesJson))
          $checksum = [System.BitConverter]::ToString($hashBytes).Replace("-", "").ToLowerInvariant()

          $manifest = [PSCustomObject]@{
            version    = $semver
            releaseId  = $env:RUN_ID
            timestamp  = $timestamp
            commitSha  = $env:COMMIT_SHA
            runId      = $env:RUN_ID
            services   = $servicesObj
            checksum   = $checksum
          }

          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path "release-manifest.json" -Encoding UTF8
          Write-Host "Generated release-manifest.json successfully with version $semver."

      - name: Cryptographically Sign Release Manifest
        run: |
          cosign sign-blob --yes --bundle release-manifest.json.bundle release-manifest.json

      - name: Validate Release Manifest Integrity
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 -ManifestPath "release-manifest.json" -Strict -VerifySignature

      - name: Upload Release Manifest & Evidence Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-manifest
          path: |
            release-manifest.json
            release-manifest.json.bundle
            sbom-pix-healthcheck.spdx.json
            sbom-pix-migrator.spdx.json
          retention-days: 90

  database-migration-dev:
    name: Database Migration (DEV)
    runs-on: ubuntu-latest
    environment: development
    needs: [sign-and-seal-release]
    timeout-minutes: 15
    outputs:
      IS_COLD_START: ${{ steps.pre_migration.outputs.IS_COLD_START }}
      STABLE_REVISION: ${{ steps.pre_migration.outputs.STABLE_REVISION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Keyless OIDC Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Release Manifest Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (DEV Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Capture N-1 Stable Revision & Lock Baseline (Pre-Migration Gate)
        id: pre_migration
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          Write-Host "Enforcing Multiple revision mode and capturing pre-migration stable baseline..."
          # 1. Garante modo de múltiplas revisões
          $revMode = az containerapp show --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" --query "properties.configuration.activeRevisionsMode" -o tsv 2>$null
          if ($revMode -ne "Multiple" -and $revMode -ne "multiple") {
            Write-Host "Setting activeRevisionsMode to Multiple..."
            az containerapp revision set-mode --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" --mode multiple
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL-CLOSED: Failed to set activeRevisionsMode to Multiple on app-pix-worker-dev!"
              exit 1
            }
          }

          # 2. Listagem de revisões existentes com Fail-Closed estrito para Cold Start
          $revisionsJson = az containerapp revision list --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" -o json 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $revisionsJson) {
            Write-Error "FAIL-CLOSED: Failed to list revisions for app-pix-worker-dev via Azure CLI!"
            exit 1
          }

          $rawTrim = $revisionsJson.Trim()
          if ($rawTrim -eq "[]") {
            Write-Host "[INFO] Cold Start detected: Revision list is strictly empty array '[]'."
            echo "IS_COLD_START=true" >> $env:GITHUB_OUTPUT
            echo "STABLE_REVISION=" >> $env:GITHUB_OUTPUT
            return
          }

          $revisions = $null
          try {
            $revisions = $revisionsJson | ConvertFrom-Json
          } catch {
            Write-Error "FAIL-CLOSED: Revisions output is not valid JSON! Error: $_"
            exit 1
          }

          if (-not $revisions -or $revisions.Count -eq 0) {
            Write-Error "FAIL-CLOSED: Revision list returned 0 items but raw output was not '[]'. Ambiguous state!"
            exit 1
          }

          $candidateSuffix = "rel-${env:RUN_NUMBER}"
          $candidateName = "app-pix-worker-dev--$candidateSuffix"
          echo "IS_COLD_START=false" >> $env:GITHUB_OUTPUT

          # 3. Identifica a revisão estável atual que atende tráfego (com Fail-Closed estrito)
          $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" -o json 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $trafficJson) {
            Write-Error "FAIL-CLOSED: Failed to retrieve active traffic configuration via Azure CLI!"
            exit 1
          }

          $trafficList = $trafficJson | ConvertFrom-Json
          $stableItem = $trafficList | Where-Object { $_.weight -ge 50 -and ($_.revisionName -ne $candidateName) } | Select-Object -First 1
          if (-not $stableItem) {
            Write-Error "FAIL-CLOSED: No revision currently holds majority traffic (weight >= 50%) distinct from candidate '$candidateName'!"
            exit 1
          }

          $targetStable = $stableItem.revisionName
          if (-not $targetStable -or [string]::IsNullOrWhiteSpace($targetStable)) {
            if ($stableItem.latestRevision -eq $true) {
              $targetStable = az containerapp show --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" --query "properties.latestRevisionName" -o tsv 2>$null
            }
          }
          if (-not $targetStable -or [string]::IsNullOrWhiteSpace($targetStable)) {
            $targetStable = az containerapp revision list --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" --query "[?properties.active && name != '$candidateName'].name | [0]" -o tsv 2>$null
          }
          if (-not $targetStable -or [string]::IsNullOrWhiteSpace($targetStable)) {
            Write-Error "FAIL-CLOSED: Could not resolve a verified prior stable revision name distinct from candidate '$candidateName'!"
            exit 1
          }

          echo "STABLE_REVISION=$targetStable" >> "$env:GITHUB_OUTPUT"
          Write-Host "Prior stable revision verified and locked for baseline: $targetStable"

          # 4. Bloqueia 100% de tráfego na revisão estável antes da migração
          az containerapp ingress traffic set `
            --name "app-pix-worker-dev" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$targetStable=100"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to execute traffic lock on prior stable revision!"
            exit 1
          }

          # 4.1 Confirma convergência de lock a 100%
          $confirmTrafficJson = az containerapp ingress traffic show --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" -o json 2>$null
          $confirmTraffic = if ($confirmTrafficJson) { $confirmTrafficJson | ConvertFrom-Json } else { @() }
          $confirmedItem = $confirmTraffic | Where-Object { $_.revisionName -eq $targetStable -and $_.weight -eq 100 }
          if (-not $confirmedItem) {
            Write-Error "FAIL-CLOSED: Traffic lock confirmation failed! Stable revision '$targetStable' is not at 100% weight."
            exit 1
          }

          # 5. Persiste registro preliminar de baseline no Key Vault
          $baselineRecord = [PSCustomObject]@{
            phase               = "StableBaselineCaptured"
            activeRevision      = $targetStable
            candidateRevision   = $candidateName
            environment         = "development"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "CLEAN"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value "$baselineRecord"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to persist StableBaselineCaptured in Key Vault!"
            exit 1
          }

          az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "PriorStableRevision" --value "$targetStable"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to persist PriorStableRevision in Key Vault!"
            exit 1
          }

      - name: Execute Database Migration Synchronously (PBI03)
        id: execute_migration
        env:
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
        run: |
          echo "Binding migration job to immutable release image: $MIGRATOR_IMAGE..."
          az containerapp job update \
            --name "job-db-migration-dev" \
            --resource-group "rg-lab-observabilidade" \
            --image "$MIGRATOR_IMAGE"

          echo "Starting synchronous database migration job..."
          EXEC_NAME=$(az containerapp job start \
            --name "job-db-migration-dev" \
            --resource-group "rg-lab-observabilidade" \
            --query "name" -o tsv)

          if [ -z "$EXEC_NAME" ]; then
            echo "CRITICAL: Failed to start migration job or empty execution name returned!"
            exit 1
          fi

          echo "MIGRATION_EXEC_NAME=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "Migration Job Execution triggered: $EXEC_NAME. Polling status until completion..."
          
          MAX_RETRIES=30
          SLEEP_SECONDS=10
          MIGRATION_SUCCEEDED=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            STATUS=$(az containerapp job execution show \
              --name "job-db-migration-dev" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv)
            echo "[$i/$MAX_RETRIES] Migration status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "Database migration finished successfully!"
              EXEC_IMG=$(az containerapp job execution show \
                --name "job-db-migration-dev" \
                --resource-group "rg-lab-observabilidade" \
                --job-execution-name "$EXEC_NAME" \
                --query "properties.template.containers[0].image" -o tsv)
              echo "Executed container image: $EXEC_IMG"
              if [ "$EXEC_IMG" != "$MIGRATOR_IMAGE" ]; then
                echo "CRITICAL: Executed migration image does not match manifest image $MIGRATOR_IMAGE!"
                exit 1
              fi
              MIGRATION_SUCCEEDED=true
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "CRITICAL: Database migration failed with status $STATUS!"
              az containerapp job execution show --name "job-db-migration-dev" --resource-group "rg-lab-observabilidade" --job-execution-name "$EXEC_NAME"
              exit 1
            fi

            sleep $SLEEP_SECONDS
          done

          if [ "$MIGRATION_SUCCEEDED" != "true" ]; then
            echo "CRITICAL: Database migration job timed out after 300 seconds without terminal Succeeded status!"
            exit 1
          fi

      - name: Stop Zombie DEV Migration Job on Interruption or Failure
        if: always() && steps.execute_migration.outcome != 'success' && env.MIGRATION_EXEC_NAME != ''
        shell: bash
        env:
          EXEC_NAME: ${{ env.MIGRATION_EXEC_NAME }}
        run: |
          echo "CRITICAL: DEV migration step was not successful! Actively stopping zombie execution: $EXEC_NAME..."
          STOP_OUTPUT=$(az containerapp job stop \
            --name "job-db-migration-dev" \
            --resource-group "rg-lab-observabilidade" \
            --job-execution-name "$EXEC_NAME" 2>&1) || true
          echo "Stop command response: $STOP_OUTPUT"

          echo "Confirming terminal status for execution $EXEC_NAME..."
          TERMINAL_CONFIRMED=false
          for ((j=1; j<=6; j++)); do
            TERM_STATUS=$(az containerapp job execution show \
              --name "job-db-migration-dev" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Terminal check [$j/6]: $TERM_STATUS"
            if [ "$TERM_STATUS" == "Stopped" ] || [ "$TERM_STATUS" == "Failed" ] || [ "$TERM_STATUS" == "Cancelled" ]; then
              echo "DEV execution successfully confirmed in terminal stopped state: $TERM_STATUS"
              TERMINAL_CONFIRMED=true
              break
            elif [ "$TERM_STATUS" == "Succeeded" ]; then
              echo "WARNING: Execution finished Succeeded during stop sequence."
              TERMINAL_CONFIRMED=true
              break
            fi
            sleep 5
          done

          if [ "$TERMINAL_CONFIRMED" != "true" ]; then
            echo "CRITICAL: Job execution $EXEC_NAME did not reach terminal state within 30s!"
            exit 1
          fi

  app-deployment-dev:
    name: App Rollout & Health Check (DEV)
    runs-on: ubuntu-latest
    environment: development
    needs: [database-migration-dev]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Keyless OIDC Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Release Manifest Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (DEV Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Deploy Candidate Revision (0% Traffic Weight with 90s Grace Period)
        id: deploy_candidate
        env:
          RUN_NUMBER: ${{ github.run_number }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        run: |
          REV_SUFFIX="rel-$RUN_NUMBER"
          echo "Deploying candidate revision with suffix: $REV_SUFFIX (Grace Period: 90s)..."
          az containerapp update \
            --name "app-pix-worker-dev" \
            --resource-group "rg-lab-observabilidade" \
            --image "$FULL_IMAGE" \
            --revision-suffix "$REV_SUFFIX" \
            --termination-grace-period 90

          CANDIDATE_REV="app-pix-worker-dev--$REV_SUFFIX"
          echo "CANDIDATE_REVISION=$CANDIDATE_REV" >> "$GITHUB_OUTPUT"
          echo "Candidate Revision Deployed with 0% initial traffic: $CANDIDATE_REV"

      - name: Probe Candidate Revision Readiness (Revision-Specific FQDN)
        id: probe_candidate
        shell: pwsh
        env:
          CANDIDATE_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
        run: |
          $candidate = $env:CANDIDATE_REV
          Write-Host "Resolving dedicated revision FQDN for candidate $candidate..."
          $revFqdn = az containerapp revision show `
            --name "app-pix-worker-dev" `
            --resource-group "rg-lab-observabilidade" `
            --revision "$candidate" `
            --query "properties.fqdn" -o tsv 2>$null

          if (-not $revFqdn) {
            Write-Error "FAIL-CLOSED: Could not resolve dedicated revision FQDN for candidate $candidate!"
            exit 1
          }

          $url = "https://$revFqdn/health"
          Write-Host "Probing candidate isolated endpoint: $url..."

          $maxAttempts = 12
          $passed = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "--- Candidate Health Probe Attempt $attempt of $maxAttempts ---"
            try {
              $resp = Invoke-WebRequest -Uri $url -TimeoutSec 10 -UseBasicParsing -ErrorAction SilentlyContinue
              if ($resp.StatusCode -eq 200) {
                $body = $resp.Content | ConvertFrom-Json
                $kv = $body.entries.azure_key_vault.status
                $sql = $body.entries.azure_sql.status
                $redis = $body.entries.azure_redis.status
                $sb = $body.entries.azure_service_bus.status

                if ($body.status -eq "Healthy" -and $kv -eq "Healthy" -and $sql -eq "Healthy" -and $redis -eq "Healthy" -and $sb -eq "Healthy") {
                  Write-Host "SUCCESS: Candidate revision $candidate confirmed Healthy with all 4 dependencies!"
                  $passed = $true
                  break
                }
              }
            } catch {
              Write-Host "Candidate probe attempt $attempt failed: $_"
            }
            Start-Sleep -Seconds 10
          }

          if (-not $passed) {
            Write-Error "FAIL-CLOSED: Candidate revision $candidate failed readiness check on its dedicated endpoint."
            exit 1
          }

      - name: Verify Backward Compatibility on Prior Stable Revision N-1 (Quality Gate)
        id: coexistence_gate
        shell: pwsh
        env:
          IS_COLD_START: ${{ needs.database-migration-dev.outputs.IS_COLD_START }}
          STABLE_REV: ${{ needs.database-migration-dev.outputs.STABLE_REVISION }}
          CANDIDATE_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
        run: |
          if ($env:IS_COLD_START -eq "true") {
            Write-Host "[INFO] Cold Start detected: Skipping N-1 coexistence gate as no prior revision exists."
            return
          }

          $stableRev = $env:STABLE_REV
          Write-Host "Executing functional coexistence verification for prior stable revision: $stableRev over migrated database..."

          Write-Host "Resolving dedicated revision FQDN for prior stable revision: $stableRev..."
          $stableFqdn = az containerapp revision show `
            --name "app-pix-worker-dev" `
            --resource-group "rg-lab-observabilidade" `
            --revision "$stableRev" `
            --query "properties.fqdn" -o tsv 2>$null

          if (-not $stableFqdn) {
            Write-Error "FAIL-CLOSED: Could not resolve dedicated revision FQDN for stable revision $stableRev!"
            exit 1
          }

          $url = "https://$stableFqdn/health"
          Write-Host "Probing live stable revision directly on dedicated revision endpoint: $url..."

          $handler = [System.Net.Http.SocketsHttpHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [System.Net.Http.HttpClient]::new($handler)
          $client.Timeout = [System.TimeSpan]::FromSeconds(5)

          $coexistencePassed = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $resp = $client.GetAsync($url).GetAwaiter().GetResult()
              $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if ([int]$resp.StatusCode -eq 200 -and -not [string]::IsNullOrWhiteSpace($body)) {
                $json = $body | ConvertFrom-Json
                $kv = $json.entries.azure_key_vault.status
                $sql = $json.entries.azure_sql.status
                $redis = $json.entries.azure_redis.status
                $sb = $json.entries.azure_service_bus.status

                if ($json.status -eq "Healthy" -and $kv -eq "Healthy" -and $sql -eq "Healthy" -and $redis -eq "Healthy" -and $sb -eq "Healthy") {
                  Write-Host "COEXISTENCE VERIFIED: Prior stable revision $stableRev is Healthy operating on expanded schema."
                  $coexistencePassed = $true
                  $resp.Dispose()
                  break
                }
              }
              $resp.Dispose()
            } catch {
              Write-Host "Coexistence attempt $i failed: $_"
            }
            Start-Sleep -Seconds 10
          }
          $client.Dispose()
          $handler.Dispose()

          if (-not $coexistencePassed) {
            Write-Host "CRITICAL: Prior stable revision $stableRev failed coexistence verification on newly migrated schema!"
            Write-Host "FAIL-CLOSED: Isolating unpromoted candidate revision $env:CANDIDATE_REV..."
            az containerapp revision deactivate `
              --name "app-pix-worker-dev" `
              --resource-group "rg-lab-observabilidade" `
              --revision "$env:CANDIDATE_REV"
            $deactExit = $LASTEXITCODE
            $deactActive = az containerapp revision show `
              --name "app-pix-worker-dev" `
              --resource-group "rg-lab-observabilidade" `
              --revision "$env:CANDIDATE_REV" `
              --query "properties.active" -o tsv 2>$null
            $showExit = $LASTEXITCODE
            $deactConfirmed = ($deactExit -eq 0 -and $showExit -eq 0 -and $deactActive -eq "false")
            Write-Host "Candidate deactivation confirmed: active=$deactActive (Confirmed=$deactConfirmed)"

            $failedRecord = [PSCustomObject]@{
              phase                = "FailedClosed"
              reason               = "NMinusOneIncompatibleWithSchema"
              activeRevision       = $stableRev
              candidateRevision    = $env:CANDIDATE_REV
              candidateDeactivated = $deactConfirmed
              environment          = "development"
              timestamp            = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState  = if ($deactConfirmed) { "INCIDENT_OPEN" } else { "RECONCILIATION_REQUIRED" }
            }

            $failedRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value ($failedRecord | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist DeploymentState in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }

            Write-Error "CRITICAL: Breaking database migration detected! Prior stable revision failed on new schema. Promotion aborted."
            exit 1
          }

      - name: Promote Candidate to 100% Traffic & Confirm Convergence
        shell: pwsh
        env:
          CANDIDATE_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          STABLE_REV: ${{ needs.database-migration-dev.outputs.STABLE_REVISION }}
          RELEASE_ID: ${{ steps.manifest_info.outputs.RELEASE_ID }}
          COMMIT_SHA: ${{ steps.manifest_info.outputs.COMMIT_SHA }}
          DIGEST: ${{ steps.manifest_info.outputs.DIGEST }}
        run: |
          $candidate = $env:CANDIDATE_REV
          Write-Host "Registering COMMUTING intent in Key Vault before traffic switch..."
          $intentPayload = [PSCustomObject]@{
            phase               = "COMMUTING"
            candidateRevision   = $candidate
            priorStableRevision = $env:STABLE_REV
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "development"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "MUTATION_IN_PROGRESS"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value "$intentPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to register COMMUTING intent in Key Vault!"
            exit 1
          }

          Write-Host "Commuting 100% of DEV traffic to newly verified candidate: $candidate..."
          az containerapp ingress traffic set `
            --name "app-pix-worker-dev" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$candidate=100"

          if ($LASTEXITCODE -ne 0) {
            $failedSetRecord = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "TrafficSetFailed"
              candidateRevision   = $candidate
              priorStableRevision = $env:STABLE_REV
              environment         = "development"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $failedSetRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value ($failedSetRecord | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            Write-Error "FAIL-CLOSED: Failed to set 100% traffic weight on app-pix-worker-dev."
            exit 1
          }

          Write-Host "Verifying Envoy traffic convergence in ACA (up to 30s)..."
          $converged = $false
          for ($p = 1; $p -le 6; $p++) {
            $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-dev" --resource-group "rg-lab-observabilidade" -o json 2>$null
            if ($trafficJson) {
              $trafficList = $trafficJson | ConvertFrom-Json
              $candidateObj = $trafficList | Where-Object { $_.revisionName -eq $candidate }
              if ($candidateObj -and $candidateObj.weight -eq 100) {
                Write-Host "[$p/6] 100% traffic weight confirmed on $candidate."
                $converged = $true
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $converged) {
            $divergentRecord = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "TrafficConvergenceTimeout"
              candidateRevision   = $candidate
              priorStableRevision = $env:STABLE_REV
              environment         = "development"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $divergentRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value ($divergentRecord | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist ReconciliationRequired in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }

            Write-Error "FAIL-CLOSED: 100% traffic convergence failed within timeout! Observed state persisted as ReconciliationRequired."
            exit 1
          }

          Write-Host "Persisting canonical deployment record with COMMITTED phase into Key Vault..."
          $committedPayload = [PSCustomObject]@{
            phase               = "COMMITTED"
            activeRevision      = $candidate
            priorStableRevision = $env:STABLE_REV
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "development"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "CLEAN"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "DeploymentState" --value "$committedPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist canonical DeploymentState in Key Vault!"
            exit 1
          }

          az keyvault secret set --vault-name "kv-pixlab-dev-c4vrp5pjwt" --name "CurrentActiveRevision" --value "$candidate"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist CurrentActiveRevision in Key Vault!"
            exit 1
          }

      - name: Save DEV Deployment Approval Evidence
        shell: pwsh
        env:
          RELEASE_RUN_ID: ${{ steps.manifest_info.outputs.RELEASE_ID }}
          DEV_RUN_ID: ${{ github.run_id }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
          COMMIT_SHA: ${{ steps.manifest_info.outputs.COMMIT_SHA }}
        run: |
          $evidence = [PSCustomObject]@{
            environment   = "development"
            releaseRunId  = $env:RELEASE_RUN_ID
            devRunId      = $env:DEV_RUN_ID
            deployedImage = $env:FULL_IMAGE
            migratorImage = $env:MIGRATOR_IMAGE
            commitSha     = $env:COMMIT_SHA
            status        = "PASSED"
            timestamp     = [System.DateTimeOffset]::UtcNow.ToString("o")
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Path "dev-approval-evidence.json" -Encoding UTF8

      - name: Upload DEV Evidence Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dev-evidence
          path: dev-approval-evidence.json
          retention-days: 90

      - name: Upload Emergency Incident Evidence Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dev-emergency-incident
          path: emergency-incident-reconciliation.json
          if-no-files-found: ignore
          retention-days: 90

  database-migration-hml:
    name: Database Migration (HOM)
    runs-on: ubuntu-latest
    environment: homologation
    needs: [app-deployment-dev]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Mandatory for Signature Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Sealed Release Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity & Signature (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Download Prior DEV Deployment Approval Evidence (PBI07)
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dev-evidence
          path: artifacts/staging/dev-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate DEV Gate Evidence (Fail-Closed)
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ github.run_id }}
        shell: pwsh
        run: |
          $devEvPath = "artifacts/staging/dev-evidence/dev-approval-evidence.json"
          $manifestPath = "artifacts/staging/release-manifest/release-manifest.json"

          if (-not (Test-Path $devEvPath)) {
            Write-Error "CRITICAL: DEV deployment evidence is missing! Cannot promote unverified release to HOM."
            exit 1
          }
          $devEv = Get-Content -Path $devEvPath -Raw | ConvertFrom-Json
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          if ($devEv.status -ne "PASSED") {
            Write-Error "CRITICAL: DEV deployment status was '$($devEv.status)' (expected PASSED). Promotion blocked."
            exit 1
          }
          if ($devEv.releaseRunId -ne $env:EXPECTED_RELEASE_RUN_ID) {
            Write-Error "CRITICAL: DEV evidence releaseRunId ($($devEv.releaseRunId)) does not match expected ($env:EXPECTED_RELEASE_RUN_ID)! Promotion blocked."
            exit 1
          }
          $expectedImage = "$($manifest.services.api.image)@$($manifest.services.api.digest)"
          if ($devEv.deployedImage -ne $expectedImage) {
            Write-Error "CRITICAL: Digest mismatch between DEV evidence ($($devEv.deployedImage)) and Release Manifest ($expectedImage)! Promotion blocked."
            exit 1
          }
          $expectedMigrator = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { $expectedImage }
          if ($devEv.migratorImage -and $devEv.migratorImage -ne $expectedMigrator) {
            Write-Error "CRITICAL: Migrator image mismatch between DEV evidence ($($devEv.migratorImage)) and Release Manifest ($expectedMigrator)! Promotion blocked."
            exit 1
          }
          Write-Host "[OK] Verified DEV deployment success evidence, releaseRunId, and digests match: $expectedImage."

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (HOM Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_HML }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_HML }}

      - name: Execute Database Migration in HOM (Synchronous Job)
        id: execute_migration
        env:
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
        run: |
          echo "Binding migration job to immutable release image: $MIGRATOR_IMAGE..."
          az containerapp job update \
            --name "job-db-migration-hml" \
            --resource-group "rg-lab-observabilidade" \
            --image "$MIGRATOR_IMAGE"

          EXEC_NAME=$(az containerapp job start \
            --name "job-db-migration-hml" \
            --resource-group "rg-lab-observabilidade" \
            --query "name" -o tsv)

          if [ -z "$EXEC_NAME" ]; then
            echo "CRITICAL: Failed to start HOM migration job or execution name empty!"
            exit 1
          fi

          echo "MIGRATION_EXEC_NAME=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "HOM Migration execution started: $EXEC_NAME"

          MAX_RETRIES=30
          MIGRATION_SUCCEEDED=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            STATUS=$(az containerapp job execution show \
              --name "job-db-migration-hml" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv)
            echo "[$i/$MAX_RETRIES] HOM Migration status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "HOM Migration completed successfully!"
              EXEC_IMG=$(az containerapp job execution show \
                --name "job-db-migration-hml" \
                --resource-group "rg-lab-observabilidade" \
                --job-execution-name "$EXEC_NAME" \
                --query "properties.template.containers[0].image" -o tsv)
              echo "Executed migration container image: $EXEC_IMG"
              if [ "$EXEC_IMG" != "$MIGRATOR_IMAGE" ]; then
                echo "CRITICAL: Executed migration image does not match manifest image $MIGRATOR_IMAGE!"
                exit 1
              fi
              MIGRATION_SUCCEEDED=true
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "CRITICAL: HOM Migration failed with status $STATUS!"
              exit 1
            fi
            sleep 10
          done

          if [ "$MIGRATION_SUCCEEDED" != "true" ]; then
            echo "CRITICAL: HOM Migration job timed out after 300 seconds without completion!"
            exit 1
          fi

      - name: Stop Zombie HOM Migration Job on Interruption or Failure
        if: always() && steps.execute_migration.outcome != 'success' && env.MIGRATION_EXEC_NAME != ''
        shell: bash
        env:
          EXEC_NAME: ${{ env.MIGRATION_EXEC_NAME }}
        run: |
          echo "CRITICAL: HOM migration step was not successful! Actively stopping zombie execution: $EXEC_NAME..."
          STOP_OUTPUT=$(az containerapp job stop \
            --name "job-db-migration-hml" \
            --resource-group "rg-lab-observabilidade" \
            --job-execution-name "$EXEC_NAME" 2>&1) || true
          echo "Stop command response: $STOP_OUTPUT"

          echo "Confirming terminal status for execution $EXEC_NAME..."
          TERMINAL_CONFIRMED=false
          for ((j=1; j<=6; j++)); do
            TERM_STATUS=$(az containerapp job execution show \
              --name "job-db-migration-hml" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Terminal check [$j/6]: $TERM_STATUS"
            if [ "$TERM_STATUS" == "Stopped" ] || [ "$TERM_STATUS" == "Failed" ] || [ "$TERM_STATUS" == "Cancelled" ]; then
              echo "HOM execution successfully confirmed in terminal stopped state: $TERM_STATUS"
              TERMINAL_CONFIRMED=true
              break
            elif [ "$TERM_STATUS" == "Succeeded" ]; then
              echo "WARNING: Execution finished Succeeded during stop sequence."
              TERMINAL_CONFIRMED=true
              break
            fi
            sleep 5
          done

          if [ "$TERMINAL_CONFIRMED" != "true" ]; then
            echo "CRITICAL: Job execution $EXEC_NAME did not reach terminal state within 30s!"
            exit 1
          fi

  canary-rollout-hml:
    name: Canary Rollout & SLO Quality Gate (HOM)
    runs-on: ubuntu-latest
    environment: homologation
    needs: [database-migration-hml]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Mandatory for Signature Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Sealed Release Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity & Signature (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (HOM Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_HML }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_HML }}

      - name: Deploy Container App to HOM
        env:
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        run: |
          az containerapp update \
            --name "app-pix-worker-hml" \
            --resource-group "rg-lab-observabilidade" \
            --image "$FULL_IMAGE"

      - name: Deep Readiness Probe (HOM)
        id: readiness_probe
        shell: pwsh
        run: |
          $fqdn = az containerapp show `
            --name "app-pix-worker-hml" `
            --resource-group "rg-lab-observabilidade" `
            --query "properties.configuration.ingress.fqdn" -o tsv
          if (-not $fqdn) {
            Write-Error "FAIL-CLOSED: Failed to resolve FQDN for app-pix-worker-hml via Azure CLI!"
            exit 1
          }
          $url = "https://$fqdn/health"
          echo "HOM_URL=$url" >> $env:GITHUB_OUTPUT
          Write-Host "Probing HOM health on $url..."

          $ready = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $url -TimeoutSec 10 -UseBasicParsing -ErrorAction SilentlyContinue
              if ($resp.StatusCode -eq 200 -and -not [string]::IsNullOrWhiteSpace($resp.Content)) {
                $json = $resp.Content | ConvertFrom-Json
                if ($json.status -eq "Healthy") {
                  Write-Host "HOM API is ready and healthy (HTTP 200, status Healthy)."
                  $ready = $true
                  break
                }
              }
            } catch {}
            Start-Sleep -Seconds 10
          }
          if (-not $ready) {
            Write-Error "HOM Readiness probe failed after 120 seconds."
            exit 1
          }

      - name: Execute Automated Quality Gate (SLOs & Fail-Closed)
        shell: pwsh
        env:
          HOM_URL: ${{ steps.readiness_probe.outputs.HOM_URL }}
        run: |
          ./scripts/ci/evaluate-quality-gate.ps1 `
            -TargetUrl "$env:HOM_URL" `
            -ThresholdP95Ms 400 `
            -ThresholdErrorRate 0.001 `
            -MinRequests 1000 `
            -DurationSeconds 300 `
            -FailClosed `
            -OutputFile "quality-gate-report.json"

      - name: Record HOM Quality Gate Evidence Manifest
        if: always()
        env:
          INPUT_RELEASE_RUN_ID: ${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
        shell: pwsh
        run: |
          if (Test-Path "quality-gate-report.json") {
            $report = Get-Content -Path "quality-gate-report.json" -Raw | ConvertFrom-Json
            $evidence = [PSCustomObject]@{
              environment    = "homologation"
              releaseRunId   = $env:INPUT_RELEASE_RUN_ID
              hmlRunId       = $env:RUN_ID
              imageDigest    = $env:FULL_IMAGE
              migratorDigest = $env:MIGRATOR_IMAGE
              verdict        = $report.Verdict
              latencyP95     = $report.LatencyP95Ms
              errorRate      = $report.ErrorRatePercentage
              timestamp      = [System.DateTimeOffset]::UtcNow.ToString("o")
            }
            $evidence | ConvertTo-Json -Depth 5 | Set-Content -Path "hom-approval-evidence.json" -Encoding UTF8
          }

      - name: Upload Quality Gate Audit Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: quality-gate-hom-report
          path: |
            quality-gate-report.json
            hom-approval-evidence.json
          retention-days: 90

  database-migration-prod:
    name: Database Migration (PRD)
    runs-on: ubuntu-latest
    environment: production
    needs: [canary-rollout-hml]
    timeout-minutes: 35
    outputs:
      STABLE_REVISION: ${{ steps.stable_rev.outputs.STABLE_REVISION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Mandatory for Signature Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Sealed Release Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity & Signature (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Download HOM Quality Gate Audit Evidence (PBI07)
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: quality-gate-hom-report
          path: artifacts/staging/quality-gate-hom-report
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate HOM Quality Gate Report Evidence (Fail-Closed)
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ github.run_id }}
        shell: pwsh
        run: |
          $gateReportPath = "artifacts/staging/quality-gate-hom-report/quality-gate-report.json"
          $evidencePath = "artifacts/staging/quality-gate-hom-report/hom-approval-evidence.json"
          $manifestPath = "artifacts/staging/release-manifest/release-manifest.json"

          if (-not (Test-Path $gateReportPath)) {
            Write-Error "CRITICAL: Homologation Quality Gate report '$gateReportPath' is missing! Cannot promote unverified release to PRD."
            exit 1
          }
          $homGate = Get-Content -Path $gateReportPath -Raw | ConvertFrom-Json
          if ($homGate.Verdict -ne "PASSED") {
            Write-Error "CRITICAL: Homologation Quality Gate verdict was '$($homGate.Verdict)'! Cannot promote to PRD."
            exit 1
          }

          if (-not (Test-Path $evidencePath)) {
            Write-Error "CRITICAL: Homologation approval evidence manifest '$evidencePath' is missing! Promotion blocked."
            exit 1
          }
          $homEv = Get-Content -Path $evidencePath -Raw | ConvertFrom-Json
          if ($homEv.verdict -ne "PASSED") {
            Write-Error "CRITICAL: HOM evidence verdict was '$($homEv.verdict)'! Cannot promote to PRD."
            exit 1
          }
          if ($homEv.releaseRunId -ne $env:EXPECTED_RELEASE_RUN_ID) {
            Write-Error "CRITICAL: HOM evidence releaseRunId ($($homEv.releaseRunId)) does not match expected ($env:EXPECTED_RELEASE_RUN_ID)! Promotion blocked."
            exit 1
          }

          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $expectedImage = "$($manifest.services.api.image)@$($manifest.services.api.digest)"
          if ($homEv.imageDigest -ne $expectedImage) {
            Write-Error "CRITICAL: Digest mismatch between HOM evidence ($($homEv.imageDigest)) and Release Manifest ($expectedImage)! Promotion blocked."
            exit 1
          }
          $expectedMigrator = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { $expectedImage }
          if ($homEv.migratorDigest -and $homEv.migratorDigest -ne $expectedMigrator) {
            Write-Error "CRITICAL: Migrator mismatch between HOM evidence ($($homEv.migratorDigest)) and Release Manifest ($expectedMigrator)! Promotion blocked."
            exit 1
          }

          Write-Host "[OK] Verified Homologation Quality Gate PASSED and Evidence digest matched: $expectedImage."

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (PRD Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Lock 100% Traffic to Stable Revision & Persist Key Vault State (PBI08)
        id: stable_rev
        shell: pwsh
        run: |
          # 1. Garante que o Container App está operando em Multiple revision mode
          $revMode = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.configuration.activeRevisionsMode" -o tsv 2>$null
          if ($revMode -ne "Multiple" -and $revMode -ne "multiple") {
            Write-Host "Enforcing Multiple revision mode on Container App..."
            az containerapp revision set-mode --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --mode multiple
          }

          # 2. Identifica a revisão estável atual que recebe tráfego e recupera histórico de segurança
          $existingPrior = az keyvault secret show --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --query "value" -o tsv 2>$null
          $candidateSuffix = "rel-${env:GITHUB_RUN_NUMBER}"
          $candidateName = "app-pix-worker-prod--$candidateSuffix"

          $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
          $activeTrafficRev = ""
          if ($trafficJson) {
            $trafficList = $trafficJson | ConvertFrom-Json
            $stable = $trafficList | Where-Object { $_.weight -ge 50 } | Select-Object -First 1
            if ($stable) { 
              $activeTrafficRev = $stable.revisionName 
              if (-not $activeTrafficRev -and $stable.latestRevision -eq $true) {
                $activeTrafficRev = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.latestRevisionName" -o tsv 2>$null
              }
            }
          }

          # Se a revisão ativa coincidir com a candidata (retry de tentativa que comutou tráfego antes de falhar),
          # recupera a $existingPrior do Key Vault para NUNCA usar a própria candidata como alvo de rollback!
          $targetStable = ""
          if ($activeTrafficRev -and $activeTrafficRev -ne $candidateName -and $activeTrafficRev -notmatch "^app-pix-worker-prod--$candidateSuffix$") {
            $targetStable = $activeTrafficRev
            Write-Host "Registering pre-mutation prior stable revision '$targetStable' in Key Vault..."
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --value "$targetStable"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist PriorStableRevision in Key Vault!"
              exit 1
            }
          } elseif ($existingPrior -and $existingPrior -ne $candidateName) {
            $targetStable = $existingPrior
            Write-Host "Retry detected: Active traffic revision was '$activeTrafficRev'. Recovering verified prior stable revision from Key Vault: '$targetStable'."
          } else {
            $targetStable = az containerapp revision list --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "[?properties.active && name != '$candidateName'].name | [0]" -o tsv 2>$null
            if (-not $targetStable) {
              Write-Error "CRITICAL: Could not resolve a verified prior stable revision distinct from candidate '$candidateName'!"
              exit 1
            }
          }

          Write-Host "Explicitly locking 100% of production traffic to stable revision: $targetStable..."
          az containerapp ingress traffic set `
            --name "app-pix-worker-prod" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$targetStable=100"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to lock 100% traffic to stable revision."
            exit 1
          }

          # Persiste estado da máquina de implantação: PREPARED
          $statePayload = [PSCustomObject]@{
            phase               = "PREPARED"
            candidateRevision   = $candidateName
            priorStableRevision = $targetStable
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
          } | ConvertTo-Json -Compress
          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$statePayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist DeploymentState in Key Vault!"
            exit 1
          }

          echo "STABLE_REVISION=$targetStable" >> $env:GITHUB_OUTPUT
          Write-Host "[OK] Current Stable Revision locked at 100% and persisted: $targetStable"

      - name: Execute Database Migration in PRD (Synchronous Job with Lock)
        id: execute_migration
        env:
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
        run: |
          echo "Binding migration job to immutable release image: $MIGRATOR_IMAGE..."
          az containerapp job update \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --image "$MIGRATOR_IMAGE"

          EXEC_NAME=$(az containerapp job start \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --query "name" -o tsv)

          if [ -z "$EXEC_NAME" ]; then
            echo "CRITICAL: Failed to start PRD migration job or execution name empty!"
            exit 1
          fi

          echo "MIGRATION_EXEC_NAME=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "PRD Migration execution started: $EXEC_NAME"

          MAX_RETRIES=30
          MIGRATION_SUCCEEDED=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            STATUS=$(az containerapp job execution show \
              --name "job-db-migration-prod" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv)
            echo "[$i/$MAX_RETRIES] PRD Migration status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "PRD Database migration finished successfully!"
              EXEC_IMG=$(az containerapp job execution show \
                --name "job-db-migration-prod" \
                --resource-group "rg-lab-observabilidade" \
                --job-execution-name "$EXEC_NAME" \
                --query "properties.template.containers[0].image" -o tsv)
              echo "Executed PRD migration container image: $EXEC_IMG"
              if [ "$EXEC_IMG" != "$MIGRATOR_IMAGE" ]; then
                echo "CRITICAL: Executed migration image does not match manifest image $MIGRATOR_IMAGE!"
                exit 1
              fi
              MIGRATION_SUCCEEDED=true
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "CRITICAL: PRD Database migration failed with status $STATUS!"
              exit 1
            fi
            sleep 10
          done

          if [ "$MIGRATION_SUCCEEDED" != "true" ]; then
            echo "CRITICAL: PRD Migration job timed out after 300 seconds without completion!"
            exit 1
          fi

      - name: Stop Zombie PRD Migration Job on Interruption or Failure
        if: always() && steps.execute_migration.outcome != 'success' && env.MIGRATION_EXEC_NAME != ''
        shell: bash
        env:
          EXEC_NAME: ${{ env.MIGRATION_EXEC_NAME }}
        run: |
          echo "CRITICAL: Migration step was not successful! Actively stopping zombie execution: $EXEC_NAME..."
          STOP_OUTPUT=$(az containerapp job stop \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --job-execution-name "$EXEC_NAME" 2>&1) || true
          echo "Stop command response: $STOP_OUTPUT"

          echo "Confirming terminal status for execution $EXEC_NAME..."
          TERMINAL_CONFIRMED=false
          for ((j=1; j<=6; j++)); do
            TERM_STATUS=$(az containerapp job execution show \
              --name "job-db-migration-prod" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Terminal check [$j/6]: $TERM_STATUS"
            if [ "$TERM_STATUS" == "Stopped" ] || [ "$TERM_STATUS" == "Failed" ] || [ "$TERM_STATUS" == "Cancelled" ]; then
              echo "Execution successfully confirmed in terminal stopped state: $TERM_STATUS"
              TERMINAL_CONFIRMED=true
              break
            elif [ "$TERM_STATUS" == "Succeeded" ]; then
              echo "WARNING: Execution finished Succeeded during stop sequence."
              TERMINAL_CONFIRMED=true
              break
            fi
            sleep 5
          done

          if [ "$TERMINAL_CONFIRMED" != "true" ]; then
            echo "CRITICAL: Job execution $EXEC_NAME did not reach terminal state within 30s!"
            exit 1
          fi

  canary-rollout-prod:
    name: Canary Progressive Rollout & Safeguards (PRD)
    runs-on: ubuntu-latest
    environment: production
    needs: [database-migration-prod]
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Mandatory for Signature Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Sealed Release Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Manifest Integrity & Signature (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release-deploy\.yml@refs/heads/main$"

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=${digest}" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT
          Write-Host "Target Image for DEV: ${image}@${digest}"
          Write-Host "Target Migrator Image for DEV: $migratorImage"

      - name: Azure Login via Federated OIDC (PRD Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Deploy Candidate Revision (Initial 0% Traffic Weight with 90s Grace Period)
        id: deploy_candidate
        env:
          RUN_NUMBER: ${{ github.run_number }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        run: |
          REV_SUFFIX="rel-$RUN_NUMBER"
          echo "Deploying candidate revision with suffix: $REV_SUFFIX (Grace Period: 90s)..."
          az containerapp update \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" \
            --image "$FULL_IMAGE" \
            --revision-suffix "$REV_SUFFIX" \
            --termination-grace-period 90

          CANDIDATE_REV="app-pix-worker-prod--$REV_SUFFIX"
          echo "CANDIDATE_REVISION=$CANDIDATE_REV" >> "$GITHUB_OUTPUT"
          echo "Candidate Revision Deployed with 0% initial traffic: $CANDIDATE_REV"

      - name: Apply Canary 90/10 Traffic Split & Verify Active State
        id: traffic_split
        env:
          STABLE: ${{ needs.database-migration-prod.outputs.STABLE_REVISION }}
          CANARY: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
        run: |
          echo "Applying traffic split: $STABLE=90, $CANARY=10..."
          az containerapp ingress traffic set \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" \
            --revision-weight "$STABLE=90" "$CANARY=10"

          echo "Confirming active traffic weights in ACA..."
          TRAFFIC_JSON=$(az containerapp ingress traffic show \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" -o json)
          echo "$TRAFFIC_JSON"
          STABLE_WEIGHT=$(echo "$TRAFFIC_JSON" | jq -r ".[] | select(.revisionName == \"$STABLE\") | .weight")
          CANARY_WEIGHT=$(echo "$TRAFFIC_JSON" | jq -r ".[] | select(.revisionName == \"$CANARY\") | .weight")
          if [ "$STABLE_WEIGHT" != "90" ] || [ "$CANARY_WEIGHT" != "10" ]; then
            echo "CRITICAL: Traffic split weights failed convergence! Stable: $STABLE_WEIGHT%, Canary: $CANARY_WEIGHT%"
            exit 1
          fi

      - name: Supervise Canary 10-Minute Bake Window (PBI08)
        id: canary_bake
        env:
          CANARY_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          STABLE_REV: ${{ needs.database-migration-prod.outputs.STABLE_REVISION }}
        shell: pwsh
        run: |
          ./scripts/ci/canary-bake-monitor.ps1 `
            -ResourceGroupName "rg-lab-observabilidade" `
            -ContainerAppName "app-pix-worker-prod" `
            -CanaryRevision "$env:CANARY_REV" `
            -StableRevision "$env:STABLE_REV" `
            -BakeWindowMinutes 10 `
            -MinRequests 600 `
            -ThresholdP95Ms 400 `
            -ThresholdErrorRate 0.001 `
            -FailClosed `
            -OutputFile "canary-bake-report.json"

      - name: Upload Canary Bake Audit Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: canary-bake-prd-report
          path: canary-bake-report.json
          retention-days: 90

      - name: Promote Candidate to 100% Production Traffic
        shell: pwsh
        env:
          CANARY: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          STABLE: ${{ needs.database-migration-prod.outputs.STABLE_REVISION }}
          RELEASE_ID: ${{ steps.manifest_info.outputs.RELEASE_ID }}
          COMMIT_SHA: ${{ steps.manifest_info.outputs.COMMIT_SHA }}
          DIGEST: ${{ steps.manifest_info.outputs.DIGEST }}
        run: |
          $canary = $env:CANARY
          Write-Host "Registering COMMUTING intent in Key Vault before final 100% traffic switch..."
          $intentPayload = [PSCustomObject]@{
            phase               = "COMMUTING"
            candidateRevision   = $canary
            priorStableRevision = $env:STABLE
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "MUTATION_IN_PROGRESS"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$intentPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to register COMMUTING intent in Key Vault!"
            exit 1
          }

          Write-Host "Bake window successfully completed with zero SLO breaches. Commuting 100% traffic to $canary..."
          az containerapp ingress traffic set `
            --name "app-pix-worker-prod" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$canary=100"
          if ($LASTEXITCODE -ne 0) {
            $failSet = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "ProductionPromotionTrafficSetFailed"
              activeRevision      = $canary
              priorStableRevision = $env:STABLE
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $failSet | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($failSet | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            Write-Error "CRITICAL: Failed to set 100% traffic to candidate revision!"
            exit 1
          }

          Write-Host "Verifying Envoy traffic convergence in ACA (up to 30s)..."
          $converged = $false
          for ($t = 1; $t -le 6; $t++) {
            $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            if ($trafficJson) {
              $trafficList = $trafficJson | ConvertFrom-Json
              $canaryObj = $trafficList | Where-Object { $_.revisionName -eq $canary }
              if ($canaryObj -and $canaryObj.weight -eq 100) {
                Write-Host "[$t/6] 100% traffic weight confirmed on $canary."
                $converged = $true
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $converged) {
            $divergent = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "ProductionPromotionConvergenceFailed"
              activeRevision      = $canary
              priorStableRevision = $env:STABLE
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $divergent | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($divergent | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            Write-Error "CRITICAL: 100% traffic convergence failed within timeout!"
            exit 1
          }

          Write-Host "Persisting canonical deployment record with COMMITTED phase into Key Vault..."
          $committedPayload = [PSCustomObject]@{
            phase               = "COMMITTED"
            activeRevision      = $canary
            priorStableRevision = $env:STABLE
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "CLEAN"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$committedPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist canonical DeploymentState in Key Vault!"
            exit 1
          }

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "CurrentActiveRevision" --value "$canary"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist CurrentActiveRevision in Key Vault!"
            exit 1
          }

      - name: Save Production Approval Evidence
        if: success()
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        shell: pwsh
        run: |
          $evidence = [PSCustomObject]@{
            environment      = "production"
            releaseRunId     = $env:RELEASE_RUN_ID
            promotedRevision = $env:CANDIDATE_REV
            promotedImage    = $env:FULL_IMAGE
            status           = "PASSED"
            timestamp        = [System.DateTimeOffset]::UtcNow.ToString("o")
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Path "prd-approval-evidence.json" -Encoding UTF8
          # Salva registro da última revisão estável
          $lastStable = [PSCustomObject]@{
            lastStableRevision = $env:CANDIDATE_REV
            timestamp          = [System.DateTimeOffset]::UtcNow.ToString("o")
          }
          $lastStable | ConvertTo-Json | Set-Content -Path "docs/pipeline/last-stable-revision.json" -Encoding UTF8

      - name: Execute Safeguarded Automatic Rollback on Any Workflow Interruption or Failure
        if: always() && (cancelled() || failure()) && steps.deploy_candidate.outcome != 'skipped'
        env:
          STABLE_REV: ${{ needs.database-migration-prod.outputs.STABLE_REVISION }}
          CANARY_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          Write-Host "CRITICAL: Production deployment interrupted or failed after candidate deployment! Evaluating live traffic state..."
          $stableRev = $env:STABLE_REV
          $canaryRev = if ($env:CANARY_REV) { $env:CANARY_REV } else { "app-pix-worker-prod--rel-${env:RUN_NUMBER}" }

          if ([string]::IsNullOrWhiteSpace($stableRev)) {
            Write-Host "Stable revision empty in step output. Querying persistent Key Vault state..."
            $stableRev = az keyvault secret show --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --query "value" -o tsv 2>$null
          }

          if ([string]::IsNullOrWhiteSpace($stableRev)) {
            Write-Error "Cannot rollback: Prior stable revision identifier is empty and unrecoverable!"
            exit 1
          }

          # Inspeciona tráfego real no Azure Container Apps
          $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
          $trafficList = if ($trafficJson) { $trafficJson | ConvertFrom-Json } else { @() }
          $canaryObj = $trafficList | Where-Object { $_.revisionName -eq $canaryRev }
          $canaryWeight = if ($canaryObj) { [int]$canaryObj.weight } else { 0 }
          $stableObj = $trafficList | Where-Object { $_.revisionName -eq $stableRev }
          $stableWeight = if ($stableObj) { [int]$stableObj.weight } else { 0 }

          Write-Host "Current live traffic distribution: Stable ($stableRev)=$stableWeight%, Canary ($canaryRev)=$canaryWeight%"

          if ($canaryWeight -eq 0 -and $stableWeight -eq 100) {
            Write-Host "Candidate revision '$canaryRev' has 0% traffic and stable '$stableRev' is already at 100%. No traffic reversion needed."
            Write-Host "Quarantining unpromoted candidate revision..."
            az containerapp revision deactivate --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev"
            $deactCmdExit = $LASTEXITCODE
            $deactCheck = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev" --query "properties.active" -o tsv 2>$null
            $showCheckExit = $LASTEXITCODE

            if ($deactCmdExit -ne 0 -or $showCheckExit -ne 0 -or $deactCheck -ne "false") {
              $failDeact = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "CandidateDeactivationFailedWhileStableAt100"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $failDeact | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($failDeact | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Candidate revision '$canaryRev' remains active or deactivation failed (deactExit=$deactCmdExit, showExit=$showCheckExit, active=$deactCheck)!"
              exit 1
            }

            $safeRecord = [PSCustomObject]@{
              phase               = "CandidateIsolated"
              activeRevision      = $stableRev
              isolatedCandidate   = $canaryRev
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "CLEAN"
            } | ConvertTo-Json -Compress
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$safeRecord"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL-CLOSED: Failed to persist CandidateIsolated state in Key Vault!"
              exit 1
            }
            exit 0
          }

          Write-Host "Canary revision is receiving live traffic ($canaryWeight%). Running pre-rollback schema compatibility check (PBI11 / Q03)..."
          ./scripts/ci/verify-schema-compatibility.ps1 `
            -TargetRevision "$stableRev" `
            -CurrentRevision "$canaryRev" `
            -Environment "production" `
            -ContainerAppName "app-pix-worker-prod" `
            -ResourceGroupName "rg-lab-observabilidade" `
            -OutputFile "rollback-schema-check.json"

          $checkExit = $LASTEXITCODE
          if ($checkExit -eq 0) {
            Write-Host "Schema is compatible! Safely reverting 100% traffic to prior stable revision: $stableRev..."
            az containerapp ingress traffic set `
              --name "app-pix-worker-prod" `
              --resource-group "rg-lab-observabilidade" `
              --revision-weight "$stableRev=100"
            if ($LASTEXITCODE -ne 0) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackTrafficSetFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "Failed to execute traffic reversal via Azure CLI. State recorded as ReconciliationRequired."
              exit 1
            }

            # Confirma convergência de tráfego de 100%
            $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            $trafficList = if ($trafficJson) { $trafficJson | ConvertFrom-Json } else { @() }
            $reverted = $trafficList | Where-Object { $_.revisionName -eq $stableRev }
            if (-not $reverted -or $reverted.weight -ne 100) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackConvergenceFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Rollback traffic convergence failed! Target $stableRev weight is not 100%. State recorded as ReconciliationRequired."
              exit 1
            }

            # Sonda de integridade profunda pós-reversão (Sem redirect e validando as 4 dependências)
            $fqdn = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.configuration.ingress.fqdn" -o tsv
            $url = "https://$fqdn/health"
            Write-Host "Verifying health probe on reverted revision: $url..."

            $handler = [System.Net.Http.SocketsHttpHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [System.TimeSpan]::FromSeconds(5)
            $reqDeps = @("azure_key_vault", "azure_sql", "azure_redis", "azure_service_bus")

            $healthy = $false
            for ($k = 1; $k -le 6; $k++) {
              try {
                $resp = $client.GetAsync($url).GetAwaiter().GetResult()
                $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                if ([int]$resp.StatusCode -eq 200 -and -not [string]::IsNullOrWhiteSpace($body)) {
                  $jsonPayload = $body | ConvertFrom-Json
                  if ($jsonPayload.status -eq "Healthy" -and $jsonPayload.entries) {
                    $depsOk = $true
                    foreach ($d in $reqDeps) {
                      if (-not $jsonPayload.entries.$d -or $jsonPayload.entries.$d.status -ne "Healthy") {
                        $depsOk = $false
                        break
                      }
                    }
                    if ($depsOk) {
                      foreach ($prop in $jsonPayload.entries.PSObject.Properties) {
                        if (-not $prop.Value.status -or $prop.Value.status -ne "Healthy") {
                          $depsOk = $false
                          break
                        }
                      }
                    }
                    if ($depsOk) {
                      $healthy = $true
                      $resp.Dispose()
                      break
                    }
                  }
                }
                $resp.Dispose()
              } catch {}
              Start-Sleep -Seconds 10
            }
            $client.Dispose()
            $handler.Dispose()

            if (-not $healthy) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackHealthFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Reverted stable revision health check failed after traffic reversal! State recorded as ReconciliationRequired."
              exit 1
            }

            # Registra estado ROLLED_BACK canônico no Key Vault com checagem atômica individual
            $rollbackState = [PSCustomObject]@{
              phase               = "ROLLED_BACK"
              activeRevision      = $stableRev
              priorStableRevision = $canaryRev
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "CLEAN"
            } | ConvertTo-Json -Compress

            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$rollbackState"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist DeploymentState in Key Vault during rollback!"
              exit 1
            }

            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "CurrentActiveRevision" --value "$stableRev"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist CurrentActiveRevision in Key Vault during rollback!"
              exit 1
            }

            Write-Host "SUCCESS: Traffic safely reverted to $stableRev and verified Healthy with all 4 dependencies."
          } else {
            Write-Host "CRITICAL DATA CORRUPTION SHIELD (PBI11): Schema compatibility check failed (Exit $checkExit)."
            Write-Host "Aborting ANY traffic reversal to prior revision '$stableRev' to prevent severe data corruption."
            Write-Host "Quarantining failed canary revision by deactivating candidate revision..."
            az containerapp revision deactivate --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev"
            $deactExit = $LASTEXITCODE
            $deactActive = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev" --query "properties.active" -o tsv 2>$null
            $showExit = $LASTEXITCODE
            $deactOk = ($deactExit -eq 0 -and $showExit -eq 0 -and $deactActive -eq "false")
            Write-Host "Candidate deactivation confirmed: active=$deactActive (Ok=$deactOk, deactExit=$deactExit, showExit=$showExit)"

            # Avalia e confirma estado real de tráfego e atividade da revisão estável após isolar a candidata
            $stableActiveQuery = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$stableRev" --query "properties.active" -o tsv 2>$null
            $stableActiveExit = $LASTEXITCODE
            $stableActiveStatus = if ($stableActiveExit -eq 0 -and $stableActiveQuery -eq "true") {
              "ACTIVE"
            } elseif ($stableActiveExit -eq 0 -and $stableActiveQuery -eq "false") {
              "INACTIVE"
            } else {
              "QUERY_FAILED"
            }

            $postTrafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            $postTrafficExit = $LASTEXITCODE
            $stableWeightPost = -1
            if ($postTrafficExit -eq 0 -and -not [string]::IsNullOrWhiteSpace($postTrafficJson)) {
              try {
                $postTrafficList = $postTrafficJson | ConvertFrom-Json
                $stablePostObj = $postTrafficList | Where-Object { $_.revisionName -eq $stableRev }
                $stableWeightPost = if ($stablePostObj) { [int]$stablePostObj.weight } else { 0 }
              } catch {
                $stableWeightPost = -1
              }
            }

            $exposedStatus = if ($stableWeightPost -lt 0) { "UNKNOWN" } elseif ($stableWeightPost -gt 0) { "TRUE" } else { "FALSE" }

            $contingencyRecord = [PSCustomObject]@{
              phase                                   = "FailedClosed"
              reason                                  = "SchemaIncompatibilityPreventsRollback"
              priorStableRevision                     = $stableRev
              stableActiveStatus                      = $stableActiveStatus
              stableTrafficWeight                     = $stableWeightPost
              isolatedCandidate                       = $canaryRev
              candidateDeactivated                    = $deactOk
              candidateDeactivateExit                 = $deactExit
              candidateShowExit                       = $showExit
              stableActiveExit                        = $stableActiveExit
              trafficQueryExit                        = $postTrafficExit
              stableTrafficExposedToIncompatibleSchema = $exposedStatus
              environment                             = "production"
              timestamp                               = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState                     = "INCIDENT_OPEN"
              recommendedAction                       = "EMERGENCY_FIX_FORWARD_REQUIRED_PREVENT_TRANSACTION_CORRUPTION"
            }

            $contingencyRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($contingencyRecord | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist contingency record in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            if (-not $deactOk) {
              Write-Error "CRITICAL: Candidate revision '$canaryRev' could NOT be confirmed inactive! SRE immediate manual intervention required."
              exit 1
            }

            Write-Error "CONTINGENCY ACTIVATED: Automatic rollback strictly prohibited due to schema incompatibility. Candidate revision isolated. Engineering hotfix required immediately."
            exit 2
          }

      - name: Upload Emergency Incident Evidence Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dev-emergency-incident
          path: emergency-incident-reconciliation.json
          if-no-files-found: ignore
          retention-days: 90
