name: CI & Quality Gate

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  quality-gate:
    name: Test Pyramid & Coverage Gate
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:3d38769352e82e3c0fcfcb76ef77be32faeb2c0b0fb649e3557cf185d85207c4
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:c0ef6a12a0e2ec6f296803e64b85c1844b2faec1f2f38d38bf42f62788d4c9d9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      servicebus-emulator:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest@sha256:e647b0e1183cf134bb8846c7dc8bb5359a68bc0661fffeefb4bb0bf38f4d8a57
        ports:
          - 5672:5672
        env:
          ACCEPT_EULA: "Y"
          SQL_SERVER: "mssql"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
          CONFIG_PATH: "/ServiceBus-Emulator/ConfigFiles/Config.json"
        volumes:
          - ./servicebus-emulator-config.json:/ServiceBus-Emulator/ConfigFiles/Config.json:ro

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore azure-cloud-estudos.sln

      - name: Build Solution (Zero Warning Tolerance)
        run: dotnet build azure-cloud-estudos.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Full Test Pyramid
        env:
          ConnectionStrings__SqlServer: "Server=localhost,1433;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;"
          ConnectionStrings__Redis: "localhost:6379"
          ConnectionStrings__ServiceBus: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
        run: |
          dotnet test azure-cloud-estudos.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verify Quality Gate Thresholds (Min 138 Tests, Zero Fail/Skip)
        shell: pwsh
        run: |
          [xml]$trx = Get-Content (Get-ChildItem -Path ./TestResults -Filter test-results.trx -Recurse).FullName
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $skipped = [int]$counters.notExecuted

          Write-Host "Quality Gate Results: Total=$total, Passed=$passed, Failed=$failed, Skipped=$skipped"
          if ($failed -gt 0) { throw "Quality Gate Failed: $failed tests failed!" }
          if ($skipped -gt 0) { throw "Quality Gate Failed: $skipped tests skipped or ignored!" }
          if ($total -lt 138) { throw "Quality Gate Failed: Baseline test count violated ($total < 138)!" }

      - name: Parse OpenCover XML and Enforce Layered Coverage Gates
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -Path ./TestResults -Filter "*coverage.opencover.xml" -Recurse
          if (-not $coverageFiles) {
            $coverageFiles = Get-ChildItem -Path ./TestResults -Filter "*.xml" -Recurse | Where-Object { $_.Name -like "*opencover*" -or $_.Name -like "*coverage*" }
          }
          if (-not $coverageFiles) {
            throw "OpenCover code coverage XML report not found in ./TestResults"
          }

          Write-Host "Discovered $($coverageFiles.Count) coverage report(s) across test projects. Aggregating multi-project metrics..."

          # Load and parse all XML documents to aggregate coverage across Unit, Integration, and Architecture suites
          $allModules = @()
          $totalGlobalPoints = 0
          $totalGlobalVisited = 0

          foreach ($f in $coverageFiles) {
            try {
              [xml]$xml = Get-Content $f.FullName
              if ($xml.CoverageSession -and $xml.CoverageSession.Modules -and $xml.CoverageSession.Modules.Module) {
                $allModules += $xml.CoverageSession.Modules.Module
              }
              if ($xml.CoverageSession -and $xml.CoverageSession.Summary) {
                $totalGlobalPoints += [int]$xml.CoverageSession.Summary.numSequencePoints
                $totalGlobalVisited += [int]$xml.CoverageSession.Summary.visitedSequencePoints
              }
            } catch {
              Write-Host "Warning: Could not parse XML from $($f.Name): $_"
            }
          }

          $thresholds = @{
            "Pix.Processing.Domain" = 90.0
            "Pix.Processing.Application" = 85.0
            "Pix.Processing.Infrastructure" = 80.0
          }

          Write-Host "Verifying Layered Coverage Thresholds against Aggregated Multi-Project Reports:"
          foreach ($layer in $thresholds.Keys) {
            $minReq = $thresholds[$layer]
            $matching = $allModules | Where-Object { $_.ModuleName -eq $layer -and $_.Summary }
            if ($matching) {
              $layerPoints = ($matching | Measure-Object -Property { [int]$_.Summary.numSequencePoints } -Sum).Sum
              $layerVisited = ($matching | Measure-Object -Property { [int]$_.Summary.visitedSequencePoints } -Sum).Sum

              $seqCov = 0.0
              if ($layerPoints -gt 0) {
                $seqCov = [Math]::Round(($layerVisited / $layerPoints) * 100.0, 2)
              }
              Write-Host "-> $layer sequence coverage: $seqCov% ($layerVisited / $layerPoints points, Requirement: >= $minReq%)"
              if ($seqCov -lt $minReq) {
                throw "Coverage Gate FAILED for layer $layer: $seqCov% < $minReq%"
              }
            } else {
              Write-Host "-> $layer module registered; checking global metric fallback..."
            }
          }

          $globalCov = 0.0
          if ($totalGlobalPoints -gt 0) {
            $globalCov = [Math]::Round(($totalGlobalVisited / $totalGlobalPoints) * 100.0, 2)
          }
          Write-Host "-> Consolidated Global Coverage: $globalCov% (Requirement: >= 85.0%)"
          if ($globalCov -lt 85.0) {
            throw "Global Coverage Gate FAILED: $globalCov% < 85.0%"
          }
          Write-Host "All Layered Coverage Gates PASSED successfully across entire solution."

      - name: N-1 Schema Compatibility Verification
        shell: pwsh
        run: |
          $migrationChanges = git diff --name-only origin/main HEAD | Select-String -Pattern "Scripts|Migrations|Migrator"
          if ($migrationChanges) {
            Write-Host "Database migrations or schema runner changes detected in PR ($($migrationChanges.Count) changes). Running N-1 Compatibility suite..."
            dotnet test tests/Integration/Integration.csproj \
              --filter "FullyQualifiedName~DbUpScriptTests|FullyQualifiedName~PersistenceTests" \
              --configuration Release \
              --no-build
            if ($LASTEXITCODE -ne 0) {
              throw "N-1 Backward Compatibility Verification FAILED!"
            }
            Write-Host "N-1 Backward Compatibility PASSED: APIs remain compatible with previous database schema."
          } else {
            Write-Host "No schema migration changes in PR. N-1 verification skipped."
          }

  docker-build:
    name: Parallel Dockerfiles Build
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "cashout-api", file: "src/Pix.CashOut.Api/Dockerfile" }
          - { name: "payment-api", file: "src/Pix.Payment.Api/Dockerfile" }
          - { name: "outbank-connector", file: "src/Outbank.Connector/Dockerfile" }
          - { name: "reconciliation-worker", file: "src/Pix.Reconciliation.Worker/Dockerfile" }
          - { name: "webhook-dispatcher", file: "src/Webhook.Dispatcher/Dockerfile" }
          - { name: "pix-migrator", file: "src/Pix.Migrator/Dockerfile" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Container Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.file }}
          push: false
          tags: ${{ matrix.service.name }}:pr-${{ github.sha }}
