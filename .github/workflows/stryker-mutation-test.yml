name: stryker-mutation-test

on:
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Executar em modo incremental (--since:origin/main)'
        type: boolean
        default: true
        required: true
  schedule:
    # Execução noturna completa (Nightly) às 03:00 UTC de segunda a sexta
    - cron: '0 3 * * 1-5'
  workflow_call:
    inputs:
      incremental:
        description: 'Executar em modo incremental (--since:origin/main)'
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: stryker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-tests:
    name: Stryker Mutation Testing (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Install Stryker.NET Global Tool
        shell: bash
        run: dotnet tool install --global dotnet-stryker

      - name: Execute Stryker Mutation Tests
        shell: bash
        run: |
          mkdir -p StrykerOutput
          if [ "${{ inputs.incremental || true }}" = "true" ] && [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Executando Stryker em modo INCREMENTAL (--since:origin/main)..."
            dotnet stryker --config-file stryker-config.json --since:origin/main
          else
            echo "Executando Stryker em modo COMPLETO (Nightly/Full)..."
            dotnet stryker --config-file stryker-config.json
          fi

      - name: Publish Step Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Relatorio de Testes de Mutacao (Stryker.NET)"
            echo "Relatorio interativo HTML gerado na pasta \`StrykerOutput/\`."
            echo "Verifique o artefato publicado para visualizar mutantes mortos, sobreviventes e mutation score."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stryker Report Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: stryker-mutation-report-run-${{ github.run_id }}
          path: StrykerOutput/
          if-no-files-found: warn
          retention-days: 14

