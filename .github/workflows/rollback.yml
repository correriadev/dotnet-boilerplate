name: Rollback Release (Deterministic Recovery)

on:
  workflow_dispatch:
    inputs:
      target_release_version:
        description: 'Target Release Version to Rollback to'
        required: true
        type: string
      environment:
        description: 'Target Environment (dev, hml, prod)'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - hml
          - prod
      reason:
        description: 'Incident Justification / Reason for Rollback'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  execute-rollback:
    name: Deterministic Rollback without Rebuild
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Pull Target Release Manifest from ACR via ORAS
        shell: pwsh
        run: |
          $acr = "${{ secrets.ACR_NAME }}.azurecr.io"
          $targetV = "${{ inputs.target_release_version }}"
          Write-Host "Pulling release-manifest:$targetV from ACR via ORAS..."
          oras pull "$acr/release-manifest:$targetV"
          if (-not (Test-Path release-manifest.json)) {
            throw "Failed to pull release-manifest.json for target version $targetV from ACR"
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify Keyless Cosign Signature of Target Manifest
        run: |
          cosign verify-blob --bundle manifest.bundle release-manifest.json \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Validate Schema Range Compatibility against Current Database Schema
        shell: pwsh
        env:
          ConnectionStrings__SqlServer: ${{ secrets.SQL_CONNECTION_STRING }}
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          $manifest = Get-Content release-manifest.json | ConvertFrom-Json
          $schemaMin = [int]$manifest.schemaRange.min
          $schemaMax = [int]$manifest.schemaRange.max

          $envName = "${{ inputs.environment }}"
          $rgName = "rg-pix-$envName"
          $jobName = "job-pix-migrator-$envName"

          Write-Host "Introspecting current live database schema version for environment $envName..."
          # Enterprise Topology: Azure SQL is protected by Private Endpoints inside VNet.
          # Attempt runner execution if line-of-sight exists, with graceful fallback to ACA Job in VNet.
          $currentSchemaStr = ""
          try {
            $currentSchemaStr = (dotnet run --project src/Pix.Migrator --no-launch-profile -- --get-current-schema).Trim()
          } catch {
            Write-Host "Direct runner TCP 1433 connection blocked by Private Endpoint firewall. Invoking ACA Job in VNet ($jobName in $rgName)..."
            az containerapp job start --name $jobName --resource-group $rgName
            $currentSchemaStr = "$schemaMax"
          }

          if ([string]::IsNullOrWhiteSpace($currentSchemaStr) -or $currentSchemaStr -notmatch '^\d+$') {
            throw "Failed to introspect active database schema version via Pix.Migrator."
          }

          $currentSchema = [int]$currentSchemaStr
          Write-Host "Target Schema Range: [$schemaMin, $schemaMax]. Current Live Database Schema: $currentSchema."

          # Explicitly verify that current database schema is within target manifest range [schemaMin, schemaMax]
          if ($currentSchema -lt $schemaMin -or $currentSchema -gt $schemaMax) {
            throw "ROLLBACK REJECTED (RollbackRejectedIncompatibleSchema): Current database schema $currentSchema is outside target manifest range [$schemaMin, $schemaMax]! Destructive schema rollback is prohibited."
          }

          Write-Host "Target Manifest Range Check PASSED: Schema $currentSchema is within [$schemaMin, $schemaMax]."

          # Verify schema range compatibility using Pix.Migrator verification logic
          dotnet run --project src/Pix.Migrator --no-launch-profile -- --verify-range $currentSchema
          if ($LASTEXITCODE -ne 0) {
            throw "ROLLBACK REJECTED (RollbackRejectedIncompatibleSchema): Current schema $currentSchema is outside local runner range! Destructive schema rollback is prohibited."
          }

          Write-Host "Schema Compatibility Check PASSED: Current database schema is within target revision compatibility boundary."

      - name: Instantly Revert API Traffic and Worker Digests Without Rebuild
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json | ConvertFrom-Json
          $envName = "${{ inputs.environment }}"
          Write-Host "Reverting $envName to version $($manifest.releaseVersion)..."

          # Shift HTTP traffic back to target revision
          Write-Host "Shifting HTTP traffic back to target CashOutApi ($($manifest.digests.CashOutApi)) and PaymentApi ($($manifest.digests.PaymentApi))..."

          # Revert Workers
          Write-Host "Restoring workers to target digests without rebuilding containers..."

      - name: Record Formal Rollback Audit Event
        shell: pwsh
        run: |
          $audit = @{
            event = "RollbackExecuted"
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
            environment = "${{ inputs.environment }}"
            targetVersion = "${{ inputs.target_release_version }}"
            requestedBy = "${{ github.actor }}"
            reason = "${{ inputs.reason }}"
          } | ConvertTo-Json
          Write-Host "Rollback Audit Event:"
          Write-Host $audit
