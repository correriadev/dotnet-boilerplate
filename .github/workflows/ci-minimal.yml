name: CI Minimal & HealthCheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-minimal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e200f3c89 # v4.3.0
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore Dependencies
        run: dotnet restore Pix.HealthCheck.sln

      - name: Build Solution
        run: dotnet build Pix.HealthCheck.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Tests
        run: dotnet test Pix.HealthCheck.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

  docker-validation:
    name: Docker Build & Live Health Probe
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Container Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: false
          load: true
          tags: pix-healthcheck:test

      - name: Run Container & Test /health Probe
        run: |
          docker run -d --name healthcheck-test -p 8080:8080 pix-healthcheck:test
          sleep 5
          curl -f -v http://localhost:8080/health || (docker logs healthcheck-test && exit 1)
          docker stop healthcheck-test
          docker rm healthcheck-test

