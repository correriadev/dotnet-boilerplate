name: CI Minimal & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-minimal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Pix.HealthCheck.sln

      - name: Build Solution
        run: dotnet build Pix.HealthCheck.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Tests
        run: dotnet test Pix.HealthCheck.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

  docker-validation:
    name: Docker Build & Local Container Probe
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Local Container Image
        run: |
          docker build -t pix-healthcheck:local .

      - name: Run Container Locally on Runner
        run: |
          docker run -d --name local-health-probe -p 8080:8080 pix-healthcheck:local
          sleep 5

      - name: Local Smoke Test (/health)
        run: |
          curl -f http://localhost:8080/health || exit 1
          docker stop local-health-probe && docker rm local-health-probe
