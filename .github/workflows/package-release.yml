name: Package Release

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: write
  packages: write

concurrency:
  group: release-packaging
  cancel-in-progress: false

jobs:
  package-and-sign:
    name: Build, Scan, Syft SBOM, Cosign & Seal Manifest
    runs-on: ubuntu-latest

    outputs:
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Monotonic Release Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release Version: $version"

      - name: Calculate Dynamic Schema Range via Pix.Migrator
        id: schema
        shell: pwsh
        run: |
          $rangeJson = dotnet run --project src/Pix.Migrator -- --get-range
          Write-Host "Computed schema range: $rangeJson"
          echo "schema_range=$rangeJson" >> $env:GITHUB_OUTPUT

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.16.1

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Build and Push 6 Immutable Artifacts to ACR
        shell: pwsh
        run: |
          $acr = "${{ secrets.ACR_NAME }}.azurecr.io"
          $v = "${{ steps.version.outputs.version }}"
          $sha = "${{ github.sha }}"

          $artifacts = @(
            @{ Name = "CashOutApi"; Dockerfile = "src/Pix.CashOut.Api/Dockerfile"; Image = "$acr/pix-cashout-api" },
            @{ Name = "PaymentApi"; Dockerfile = "src/Pix.Payment.Api/Dockerfile"; Image = "$acr/pix-payment-api" },
            @{ Name = "OutbankConnector"; Dockerfile = "src/Outbank.Connector/Dockerfile"; Image = "$acr/pix-outbank-connector" },
            @{ Name = "ReconciliationWorker"; Dockerfile = "src/Pix.Reconciliation.Worker/Dockerfile"; Image = "$acr/pix-reconciliation-worker" },
            @{ Name = "WebhookDispatcher"; Dockerfile = "src/Webhook.Dispatcher/Dockerfile"; Image = "$acr/pix-webhook-dispatcher" },
            @{ Name = "Migrator"; Dockerfile = "src/Pix.Migrator/Dockerfile"; Image = "$acr/pix-migrator" }
          )

          $digests = @{}

          # Pinned Trivy image digest for supply chain security
          $trivyImage = "aquasec/trivy:0.56.2@sha256:3ef8ba7f9f257b4f53ec9cb761005a5a1f64f40f2f3d9b4b0eb03f39a0ef0c20"

          foreach ($a in $artifacts) {
            Write-Host "1. Building local image for $($a.Name)..."
            docker build -t "$($a.Image):$v" -t "$($a.Image):$sha" -f $a.Dockerfile .

            # Pre-push Vulnerability Scan with Pinned Trivy (blocking Critical/High before registry contamination)
            Write-Host "2. Scanning local image $($a.Name) with Pinned Trivy ($trivyImage)..."
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $trivyImage image --exit-code 1 --severity CRITICAL,HIGH "$($a.Image):$v"
            if ($LASTEXITCODE -ne 0) {
              throw "SECURITY GATE BLOCKED: High or Critical vulnerabilities detected in $($a.Name). Push to ACR aborted."
            }

            # Generate SBOM with Syft
            Write-Host "3. Generating SBOM for $($a.Name) with Syft..."
            syft "$($a.Image):$v" -o spdx-json > "sbom-$($a.Name).json"

            # Push to ACR ONLY after scan passes clean
            Write-Host "4. Pushing verified image $($a.Name) to ACR..."
            docker push "$($a.Image):$v"

            $digest = docker inspect --format='{{index .RepoDigests 0}}' "$($a.Image):$v"
            $hash = ($digest -split '@')[1]
            $digests[$a.Name] = $hash
            Write-Host "$($a.Name) Digest: $hash"

            # Keyless Sign Image with Cosign
            Write-Host "5. Signing $($a.Name) via Cosign..."
            cosign sign --yes "$($a.Image)@$hash"
          }

          # Assemble release-manifest.json with dynamic schema range
          $range = '${{ steps.schema.outputs.schema_range }}' | ConvertFrom-Json
          $manifest = @{
            releaseVersion = [long]$v
            commitSha = $sha
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
            schemaRange = @{
              min = [int]$range.min
              max = [int]$range.max
            }
            digests = $digests
          }

          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          $manifestJson | Out-File -FilePath release-manifest.json -Encoding utf8
          Write-Host "Sealed release-manifest.json:"
          Write-Host $manifestJson

          # Keyless sign the release-manifest.json
          cosign sign-blob --yes --bundle manifest.bundle release-manifest.json

          # Publish immutable manifest to ACR as OCI artifact via ORAS
          Write-Host "Publishing release-manifest.json to ACR as OCI Artifact ($acr/release-manifest:$v)..."
          oras push "$acr/release-manifest:$v" release-manifest.json:application/json manifest.bundle:application/octet-stream
          oras push "$acr/release-manifest:latest" release-manifest.json:application/json manifest.bundle:application/octet-stream

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            release-manifest.json
            manifest.bundle
            sbom-*.json
