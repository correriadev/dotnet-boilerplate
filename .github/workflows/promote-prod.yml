name: Promote to Production (Canary & Governance Gate)

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Release Run ID containing the sealed manifest'
        required: true
        type: string
      hml_run_id:
        description: 'HOM Promotion Run ID (optional; auto-resolved from commit if empty)'
        required: false
        type: string
        default: ''

concurrency:
  group: env-traffic-mutation-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  promote-production:
    name: Production Canary Rollout & Governance
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign CLI (Mandatory for Signature Verification)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Download Sealed Release Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: artifacts/staging/release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify Manifest Integrity & Signature (PBI01 / PBI02)
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          ./scripts/ci/verify-manifest.ps1 `
            -ManifestPath "artifacts/staging/release-manifest/release-manifest.json" `
            -Strict `
            -VerifySignature `
            -CertificateIdentityRegexp "^https://github\.com/$($env:GITHUB_REPO)/\.github/workflows/package-release\.yml@refs/heads/main$"

      - name: Resolve HOM Promotion Run ID
        env:
          INPUT_HML_RUN_ID: ${{ inputs.hml_run_id }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $hmlRun = $env:INPUT_HML_RUN_ID
          if ($hmlRun -and $hmlRun -notmatch '^[0-9]+$') {
            Write-Error "Invalid hml_run_id: must be numeric."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($hmlRun)) {
            $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
            $commitSha = $manifest.commitSha
            Write-Host "Resolving successful promote-hml run for commit $commitSha..."
            $runs = gh run list --workflow promote-hml.yml --commit $commitSha --status success --json databaseId -q ".[0].databaseId" 2>$null
            if ($runs) {
              $hmlRun = $runs.Trim()
              Write-Host "Resolved HOM Run ID: $hmlRun"
            } else {
              Write-Error "CRITICAL: Could not resolve a successful promote-hml run for commit $commitSha!"
              exit 1
            }
          }
          echo "HML_RUN_ID=$hmlRun" >> $env:GITHUB_ENV

      - name: Download HOM Quality Gate Audit Evidence (PBI07)
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: quality-gate-hom-report
          path: artifacts/staging/quality-gate-hom-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.HML_RUN_ID }}

      - name: Validate HOM Quality Gate Report Evidence (Fail-Closed)
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: pwsh
        run: |
          $gateReportPath = "artifacts/staging/quality-gate-hom-report/quality-gate-report.json"
          $evidencePath = "artifacts/staging/quality-gate-hom-report/hom-approval-evidence.json"
          $manifestPath = "artifacts/staging/release-manifest/release-manifest.json"

          if (-not (Test-Path $gateReportPath)) {
            Write-Error "CRITICAL: Homologation Quality Gate report '$gateReportPath' is missing! Cannot promote unverified release to PRD."
            exit 1
          }
          $homGate = Get-Content -Path $gateReportPath -Raw | ConvertFrom-Json
          if ($homGate.Verdict -ne "PASSED") {
            Write-Error "CRITICAL: Homologation Quality Gate verdict was '$($homGate.Verdict)'! Cannot promote to PRD."
            exit 1
          }

          if (-not (Test-Path $evidencePath)) {
            Write-Error "CRITICAL: Homologation approval evidence manifest '$evidencePath' is missing! Promotion blocked."
            exit 1
          }
          $homEv = Get-Content -Path $evidencePath -Raw | ConvertFrom-Json
          if ($homEv.verdict -ne "PASSED") {
            Write-Error "CRITICAL: HOM evidence verdict was '$($homEv.verdict)'! Cannot promote to PRD."
            exit 1
          }
          if ($homEv.releaseRunId -ne $env:EXPECTED_RELEASE_RUN_ID) {
            Write-Error "CRITICAL: HOM evidence releaseRunId ($($homEv.releaseRunId)) does not match expected ($env:EXPECTED_RELEASE_RUN_ID)! Promotion blocked."
            exit 1
          }

          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $expectedImage = "$($manifest.services.api.image)@$($manifest.services.api.digest)"
          if ($homEv.imageDigest -ne $expectedImage) {
            Write-Error "CRITICAL: Digest mismatch between HOM evidence ($($homEv.imageDigest)) and Release Manifest ($expectedImage)! Promotion blocked."
            exit 1
          }
          $expectedMigrator = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { $expectedImage }
          if ($homEv.migratorDigest -and $homEv.migratorDigest -ne $expectedMigrator) {
            Write-Error "CRITICAL: Migrator mismatch between HOM evidence ($($homEv.migratorDigest)) and Release Manifest ($expectedMigrator)! Promotion blocked."
            exit 1
          }

          Write-Host "[OK] Verified Homologation Quality Gate PASSED and Evidence digest matched: $expectedImage."

      - name: Extract Immutable Image Digest
        id: manifest_info
        shell: pwsh
        run: |
          $manifest = Get-Content -Path "artifacts/staging/release-manifest/release-manifest.json" -Raw | ConvertFrom-Json
          $digest = $manifest.services.api.digest
          $image = $manifest.services.api.image
          $migratorImage = if ($manifest.services.migrator) { "$($manifest.services.migrator.image)@$($manifest.services.migrator.digest)" } else { "${image}@${digest}" }
          echo "FULL_IMAGE=${image}@${digest}" >> $env:GITHUB_OUTPUT
          echo "MIGRATOR_IMAGE=$migratorImage" >> $env:GITHUB_OUTPUT
          echo "DIGEST=$digest" >> $env:GITHUB_OUTPUT
          echo "COMMIT_SHA=$($manifest.commitSha)" >> $env:GITHUB_OUTPUT
          echo "RELEASE_ID=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT

      - name: Azure Login via Federated OIDC (PRD Identity)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Lock 100% Traffic to Stable Revision & Persist Key Vault State (PBI08)
        id: stable_rev
        shell: pwsh
        run: |
          # 1. Garante que o Container App está operando em Multiple revision mode
          $revMode = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.configuration.activeRevisionsMode" -o tsv 2>$null
          if ($revMode -ne "Multiple" -and $revMode -ne "multiple") {
            Write-Host "Enforcing Multiple revision mode on Container App..."
            az containerapp revision set-mode --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --mode multiple
          }

          # 2. Identifica a revisão estável atual que recebe tráfego e recupera histórico de segurança
          $existingPrior = az keyvault secret show --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --query "value" -o tsv 2>$null
          $candidateSuffix = "rel-${env:GITHUB_RUN_NUMBER}"
          $candidateName = "app-pix-worker-prod--$candidateSuffix"

          $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
          $activeTrafficRev = ""
          if ($trafficJson) {
            $trafficList = $trafficJson | ConvertFrom-Json
            $stable = $trafficList | Where-Object { $_.weight -ge 50 } | Select-Object -First 1
            if ($stable) { 
              $activeTrafficRev = $stable.revisionName 
              if (-not $activeTrafficRev -and $stable.latestRevision -eq $true) {
                $activeTrafficRev = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.latestRevisionName" -o tsv 2>$null
              }
            }
          }

          # Se a revisão ativa coincidir com a candidata (retry de tentativa que comutou tráfego antes de falhar),
          # recupera a $existingPrior do Key Vault para NUNCA usar a própria candidata como alvo de rollback!
          $targetStable = ""
          if ($activeTrafficRev -and $activeTrafficRev -ne $candidateName -and $activeTrafficRev -notmatch "^app-pix-worker-prod--$candidateSuffix$") {
            $targetStable = $activeTrafficRev
            Write-Host "Registering pre-mutation prior stable revision '$targetStable' in Key Vault..."
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --value "$targetStable"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist PriorStableRevision in Key Vault!"
              exit 1
            }
          } elseif ($existingPrior -and $existingPrior -ne $candidateName) {
            $targetStable = $existingPrior
            Write-Host "Retry detected: Active traffic revision was '$activeTrafficRev'. Recovering verified prior stable revision from Key Vault: '$targetStable'."
          } else {
            $targetStable = az containerapp revision list --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "[?properties.active && name != '$candidateName'].name | [0]" -o tsv 2>$null
            if (-not $targetStable) {
              Write-Error "CRITICAL: Could not resolve a verified prior stable revision distinct from candidate '$candidateName'!"
              exit 1
            }
          }

          Write-Host "Explicitly locking 100% of production traffic to stable revision: $targetStable..."
          az containerapp ingress traffic set `
            --name "app-pix-worker-prod" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$targetStable=100"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to lock 100% traffic to stable revision."
            exit 1
          }

          # Persiste estado da máquina de implantação: PREPARED
          $statePayload = [PSCustomObject]@{
            phase               = "PREPARED"
            candidateRevision   = $candidateName
            priorStableRevision = $targetStable
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
          } | ConvertTo-Json -Compress
          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$statePayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist DeploymentState in Key Vault!"
            exit 1
          }

          echo "STABLE_REVISION=$targetStable" >> $env:GITHUB_OUTPUT
          Write-Host "[OK] Current Stable Revision locked at 100% and persisted: $targetStable"

      - name: Execute Database Migration in PRD (Synchronous Job with Lock)
        id: execute_migration
        env:
          MIGRATOR_IMAGE: ${{ steps.manifest_info.outputs.MIGRATOR_IMAGE }}
        run: |
          echo "Binding migration job to immutable release image: $MIGRATOR_IMAGE..."
          az containerapp job update \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --image "$MIGRATOR_IMAGE"

          EXEC_NAME=$(az containerapp job start \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --query "name" -o tsv)

          if [ -z "$EXEC_NAME" ]; then
            echo "CRITICAL: Failed to start PRD migration job or execution name empty!"
            exit 1
          fi

          echo "MIGRATION_EXEC_NAME=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "PRD Migration execution started: $EXEC_NAME"

          MAX_RETRIES=30
          MIGRATION_SUCCEEDED=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            STATUS=$(az containerapp job execution show \
              --name "job-db-migration-prod" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv)
            echo "[$i/$MAX_RETRIES] PRD Migration status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "PRD Database migration finished successfully!"
              EXEC_IMG=$(az containerapp job execution show \
                --name "job-db-migration-prod" \
                --resource-group "rg-lab-observabilidade" \
                --job-execution-name "$EXEC_NAME" \
                --query "properties.template.containers[0].image" -o tsv)
              echo "Executed PRD migration container image: $EXEC_IMG"
              if [ "$EXEC_IMG" != "$MIGRATOR_IMAGE" ]; then
                echo "CRITICAL: Executed migration image does not match manifest image $MIGRATOR_IMAGE!"
                exit 1
              fi
              MIGRATION_SUCCEEDED=true
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "CRITICAL: PRD Database migration failed with status $STATUS!"
              exit 1
            fi
            sleep 10
          done

          if [ "$MIGRATION_SUCCEEDED" != "true" ]; then
            echo "CRITICAL: PRD Migration job timed out after 300 seconds without completion!"
            exit 1
          fi

      - name: Stop Zombie PRD Migration Job on Interruption or Failure
        if: always() && steps.execute_migration.outcome != 'success' && env.MIGRATION_EXEC_NAME != ''
        shell: bash
        env:
          EXEC_NAME: ${{ env.MIGRATION_EXEC_NAME }}
        run: |
          echo "CRITICAL: Migration step was not successful! Actively stopping zombie execution: $EXEC_NAME..."
          STOP_OUTPUT=$(az containerapp job stop \
            --name "job-db-migration-prod" \
            --resource-group "rg-lab-observabilidade" \
            --job-execution-name "$EXEC_NAME" 2>&1) || true
          echo "Stop command response: $STOP_OUTPUT"

          echo "Confirming terminal status for execution $EXEC_NAME..."
          TERMINAL_CONFIRMED=false
          for ((j=1; j<=6; j++)); do
            TERM_STATUS=$(az containerapp job execution show \
              --name "job-db-migration-prod" \
              --resource-group "rg-lab-observabilidade" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Terminal check [$j/6]: $TERM_STATUS"
            if [ "$TERM_STATUS" == "Stopped" ] || [ "$TERM_STATUS" == "Failed" ] || [ "$TERM_STATUS" == "Cancelled" ]; then
              echo "Execution successfully confirmed in terminal stopped state: $TERM_STATUS"
              TERMINAL_CONFIRMED=true
              break
            elif [ "$TERM_STATUS" == "Succeeded" ]; then
              echo "WARNING: Execution finished Succeeded during stop sequence."
              TERMINAL_CONFIRMED=true
              break
            fi
            sleep 5
          done

          if [ "$TERMINAL_CONFIRMED" != "true" ]; then
            echo "CRITICAL: Job execution $EXEC_NAME did not reach terminal state within 30s!"
            exit 1
          fi

      - name: Deploy Candidate Revision (Initial 0% Traffic Weight with 90s Grace Period)
        id: deploy_candidate
        env:
          RUN_NUMBER: ${{ github.run_number }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        run: |
          REV_SUFFIX="rel-$RUN_NUMBER"
          echo "Deploying candidate revision with suffix: $REV_SUFFIX (Grace Period: 90s)..."
          az containerapp update \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" \
            --image "$FULL_IMAGE" \
            --revision-suffix "$REV_SUFFIX" \
            --termination-grace-period 90

          CANDIDATE_REV="app-pix-worker-prod--$REV_SUFFIX"
          echo "CANDIDATE_REVISION=$CANDIDATE_REV" >> "$GITHUB_OUTPUT"
          echo "Candidate Revision Deployed with 0% initial traffic: $CANDIDATE_REV"

      - name: Apply Canary 90/10 Traffic Split & Verify Active State
        id: traffic_split
        env:
          STABLE: ${{ steps.stable_rev.outputs.STABLE_REVISION }}
          CANARY: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
        run: |
          echo "Applying traffic split: $STABLE=90, $CANARY=10..."
          az containerapp ingress traffic set \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" \
            --revision-weight "$STABLE=90" "$CANARY=10"

          echo "Confirming active traffic weights in ACA..."
          TRAFFIC_JSON=$(az containerapp ingress traffic show \
            --name "app-pix-worker-prod" \
            --resource-group "rg-lab-observabilidade" -o json)
          echo "$TRAFFIC_JSON"
          STABLE_WEIGHT=$(echo "$TRAFFIC_JSON" | jq -r ".[] | select(.revisionName == \"$STABLE\") | .weight")
          CANARY_WEIGHT=$(echo "$TRAFFIC_JSON" | jq -r ".[] | select(.revisionName == \"$CANARY\") | .weight")
          if [ "$STABLE_WEIGHT" != "90" ] || [ "$CANARY_WEIGHT" != "10" ]; then
            echo "CRITICAL: Traffic split weights failed convergence! Stable: $STABLE_WEIGHT%, Canary: $CANARY_WEIGHT%"
            exit 1
          fi

      - name: Supervise Canary 10-Minute Bake Window (PBI08)
        id: canary_bake
        env:
          CANARY_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          STABLE_REV: ${{ steps.stable_rev.outputs.STABLE_REVISION }}
        shell: pwsh
        run: |
          ./scripts/ci/canary-bake-monitor.ps1 `
            -ResourceGroupName "rg-lab-observabilidade" `
            -ContainerAppName "app-pix-worker-prod" `
            -CanaryRevision "$env:CANARY_REV" `
            -StableRevision "$env:STABLE_REV" `
            -BakeWindowMinutes 10 `
            -MinRequests 600 `
            -ThresholdP95Ms 400 `
            -ThresholdErrorRate 0.001 `
            -FailClosed `
            -OutputFile "canary-bake-report.json"

      - name: Upload Canary Bake Audit Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: canary-bake-prd-report
          path: canary-bake-report.json
          retention-days: 90

      - name: Promote Candidate to 100% Production Traffic
        shell: pwsh
        env:
          CANARY: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          STABLE: ${{ steps.stable_rev.outputs.STABLE_REVISION }}
          RELEASE_ID: ${{ steps.manifest_info.outputs.RELEASE_ID }}
          COMMIT_SHA: ${{ steps.manifest_info.outputs.COMMIT_SHA }}
          DIGEST: ${{ steps.manifest_info.outputs.DIGEST }}
        run: |
          $canary = $env:CANARY
          Write-Host "Registering COMMUTING intent in Key Vault before final 100% traffic switch..."
          $intentPayload = [PSCustomObject]@{
            phase               = "COMMUTING"
            candidateRevision   = $canary
            priorStableRevision = $env:STABLE
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "MUTATION_IN_PROGRESS"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$intentPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL-CLOSED: Failed to register COMMUTING intent in Key Vault!"
            exit 1
          }

          Write-Host "Bake window successfully completed with zero SLO breaches. Commuting 100% traffic to $canary..."
          az containerapp ingress traffic set `
            --name "app-pix-worker-prod" `
            --resource-group "rg-lab-observabilidade" `
            --revision-weight "$canary=100"
          if ($LASTEXITCODE -ne 0) {
            $failSet = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "ProductionPromotionTrafficSetFailed"
              activeRevision      = $canary
              priorStableRevision = $env:STABLE
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $failSet | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($failSet | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            Write-Error "CRITICAL: Failed to set 100% traffic to candidate revision!"
            exit 1
          }

          Write-Host "Verifying Envoy traffic convergence in ACA (up to 30s)..."
          $converged = $false
          for ($t = 1; $t -le 6; $t++) {
            $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            if ($trafficJson) {
              $trafficList = $trafficJson | ConvertFrom-Json
              $canaryObj = $trafficList | Where-Object { $_.revisionName -eq $canary }
              if ($canaryObj -and $canaryObj.weight -eq 100) {
                Write-Host "[$t/6] 100% traffic weight confirmed on $canary."
                $converged = $true
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $converged) {
            $divergent = [PSCustomObject]@{
              phase               = "ReconciliationRequired"
              reason              = "ProductionPromotionConvergenceFailed"
              activeRevision      = $canary
              priorStableRevision = $env:STABLE
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "INCIDENT_OPEN"
            }
            $divergent | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($divergent | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            Write-Error "CRITICAL: 100% traffic convergence failed within timeout!"
            exit 1
          }

          Write-Host "Persisting canonical deployment record with COMMITTED phase into Key Vault..."
          $committedPayload = [PSCustomObject]@{
            phase               = "COMMITTED"
            activeRevision      = $canary
            priorStableRevision = $env:STABLE
            releaseId           = $env:RELEASE_ID
            commitSha           = $env:COMMIT_SHA
            imageDigest         = $env:DIGEST
            environment         = "production"
            timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
            reconciliationState = "CLEAN"
          } | ConvertTo-Json -Compress

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$committedPayload"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist canonical DeploymentState in Key Vault!"
            exit 1
          }

          az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "CurrentActiveRevision" --value "$canary"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Failed to persist CurrentActiveRevision in Key Vault!"
            exit 1
          }

      - name: Save Production Approval Evidence
        if: success()
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          CANDIDATE_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          FULL_IMAGE: ${{ steps.manifest_info.outputs.FULL_IMAGE }}
        shell: pwsh
        run: |
          $evidence = [PSCustomObject]@{
            environment      = "production"
            releaseRunId     = $env:RELEASE_RUN_ID
            promotedRevision = $env:CANDIDATE_REV
            promotedImage    = $env:FULL_IMAGE
            status           = "PASSED"
            timestamp        = [System.DateTimeOffset]::UtcNow.ToString("o")
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Path "prd-approval-evidence.json" -Encoding UTF8
          # Salva registro da última revisão estável
          $lastStable = [PSCustomObject]@{
            lastStableRevision = $env:CANDIDATE_REV
            timestamp          = [System.DateTimeOffset]::UtcNow.ToString("o")
          }
          $lastStable | ConvertTo-Json | Set-Content -Path "docs/pipeline/last-stable-revision.json" -Encoding UTF8

      - name: Execute Safeguarded Automatic Rollback on Any Workflow Interruption or Failure
        if: always() && (cancelled() || failure()) && steps.deploy_candidate.outcome != 'skipped'
        env:
          STABLE_REV: ${{ steps.stable_rev.outputs.STABLE_REVISION }}
          CANARY_REV: ${{ steps.deploy_candidate.outputs.CANDIDATE_REVISION }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          Write-Host "CRITICAL: Production deployment interrupted or failed after candidate deployment! Evaluating live traffic state..."
          $stableRev = $env:STABLE_REV
          $canaryRev = if ($env:CANARY_REV) { $env:CANARY_REV } else { "app-pix-worker-prod--rel-${env:RUN_NUMBER}" }

          if ([string]::IsNullOrWhiteSpace($stableRev)) {
            Write-Host "Stable revision empty in step output. Querying persistent Key Vault state..."
            $stableRev = az keyvault secret show --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "PriorStableRevision" --query "value" -o tsv 2>$null
          }

          if ([string]::IsNullOrWhiteSpace($stableRev)) {
            Write-Error "Cannot rollback: Prior stable revision identifier is empty and unrecoverable!"
            exit 1
          }

          # Inspeciona tráfego real no Azure Container Apps
          $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
          $trafficList = if ($trafficJson) { $trafficJson | ConvertFrom-Json } else { @() }
          $canaryObj = $trafficList | Where-Object { $_.revisionName -eq $canaryRev }
          $canaryWeight = if ($canaryObj) { [int]$canaryObj.weight } else { 0 }
          $stableObj = $trafficList | Where-Object { $_.revisionName -eq $stableRev }
          $stableWeight = if ($stableObj) { [int]$stableObj.weight } else { 0 }

          Write-Host "Current live traffic distribution: Stable ($stableRev)=$stableWeight%, Canary ($canaryRev)=$canaryWeight%"

          if ($canaryWeight -eq 0 -and $stableWeight -eq 100) {
            Write-Host "Candidate revision '$canaryRev' has 0% traffic and stable '$stableRev' is already at 100%. No traffic reversion needed."
            Write-Host "Quarantining unpromoted candidate revision..."
            az containerapp revision deactivate --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev"
            $deactCmdExit = $LASTEXITCODE
            $deactCheck = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev" --query "properties.active" -o tsv 2>$null
            $showCheckExit = $LASTEXITCODE

            if ($deactCmdExit -ne 0 -or $showCheckExit -ne 0 -or $deactCheck -ne "false") {
              $failDeact = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "CandidateDeactivationFailedWhileStableAt100"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $failDeact | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($failDeact | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Candidate revision '$canaryRev' remains active or deactivation failed (deactExit=$deactCmdExit, showExit=$showCheckExit, active=$deactCheck)!"
              exit 1
            }

            $safeRecord = [PSCustomObject]@{
              phase               = "CandidateIsolated"
              activeRevision      = $stableRev
              isolatedCandidate   = $canaryRev
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "CLEAN"
            } | ConvertTo-Json -Compress
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$safeRecord"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL-CLOSED: Failed to persist CandidateIsolated state in Key Vault!"
              exit 1
            }
            exit 0
          }

          Write-Host "Canary revision is receiving live traffic ($canaryWeight%). Running pre-rollback schema compatibility check (PBI11 / Q03)..."
          ./scripts/ci/verify-schema-compatibility.ps1 `
            -TargetRevision "$stableRev" `
            -CurrentRevision "$canaryRev" `
            -Environment "production" `
            -ContainerAppName "app-pix-worker-prod" `
            -ResourceGroupName "rg-lab-observabilidade" `
            -OutputFile "rollback-schema-check.json"

          $checkExit = $LASTEXITCODE
          if ($checkExit -eq 0) {
            Write-Host "Schema is compatible! Safely reverting 100% traffic to prior stable revision: $stableRev..."
            az containerapp ingress traffic set `
              --name "app-pix-worker-prod" `
              --resource-group "rg-lab-observabilidade" `
              --revision-weight "$stableRev=100"
            if ($LASTEXITCODE -ne 0) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackTrafficSetFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "Failed to execute traffic reversal via Azure CLI. State recorded as ReconciliationRequired."
              exit 1
            }

            # Confirma convergência de tráfego de 100%
            $trafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            $trafficList = if ($trafficJson) { $trafficJson | ConvertFrom-Json } else { @() }
            $reverted = $trafficList | Where-Object { $_.revisionName -eq $stableRev }
            if (-not $reverted -or $reverted.weight -ne 100) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackConvergenceFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Rollback traffic convergence failed! Target $stableRev weight is not 100%. State recorded as ReconciliationRequired."
              exit 1
            }

            # Sonda de integridade profunda pós-reversão (Sem redirect e validando as 4 dependências)
            $fqdn = az containerapp show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --query "properties.configuration.ingress.fqdn" -o tsv
            $url = "https://$fqdn/health"
            Write-Host "Verifying health probe on reverted revision: $url..."

            $handler = [System.Net.Http.SocketsHttpHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [System.TimeSpan]::FromSeconds(5)
            $reqDeps = @("azure_key_vault", "azure_sql", "azure_redis", "azure_service_bus")

            $healthy = $false
            for ($k = 1; $k -le 6; $k++) {
              try {
                $resp = $client.GetAsync($url).GetAwaiter().GetResult()
                $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                if ([int]$resp.StatusCode -eq 200 -and -not [string]::IsNullOrWhiteSpace($body)) {
                  $jsonPayload = $body | ConvertFrom-Json
                  if ($jsonPayload.status -eq "Healthy" -and $jsonPayload.entries) {
                    $depsOk = $true
                    foreach ($d in $reqDeps) {
                      if (-not $jsonPayload.entries.$d -or $jsonPayload.entries.$d.status -ne "Healthy") {
                        $depsOk = $false
                        break
                      }
                    }
                    if ($depsOk) {
                      foreach ($prop in $jsonPayload.entries.PSObject.Properties) {
                        if (-not $prop.Value.status -or $prop.Value.status -ne "Healthy") {
                          $depsOk = $false
                          break
                        }
                      }
                    }
                    if ($depsOk) {
                      $healthy = $true
                      $resp.Dispose()
                      break
                    }
                  }
                }
                $resp.Dispose()
              } catch {}
              Start-Sleep -Seconds 10
            }
            $client.Dispose()
            $handler.Dispose()

            if (-not $healthy) {
              $recRecord = [PSCustomObject]@{
                phase               = "ReconciliationRequired"
                reason              = "AutomaticRollbackHealthFailed"
                activeRevision      = $stableRev
                candidateRevision   = $canaryRev
                environment         = "production"
                timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
                reconciliationState = "INCIDENT_OPEN"
              }
              $recRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
              az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($recRecord | ConvertTo-Json -Compress)
              if ($LASTEXITCODE -ne 0) {
                Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist incident in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
              }
              Write-Error "FAIL-CLOSED: Reverted stable revision health check failed after traffic reversal! State recorded as ReconciliationRequired."
              exit 1
            }

            # Registra estado ROLLED_BACK canônico no Key Vault com checagem atômica individual
            $rollbackState = [PSCustomObject]@{
              phase               = "ROLLED_BACK"
              activeRevision      = $stableRev
              priorStableRevision = $canaryRev
              environment         = "production"
              timestamp           = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState = "CLEAN"
            } | ConvertTo-Json -Compress

            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value "$rollbackState"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist DeploymentState in Key Vault during rollback!"
              exit 1
            }

            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "CurrentActiveRevision" --value "$stableRev"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: Failed to persist CurrentActiveRevision in Key Vault during rollback!"
              exit 1
            }

            Write-Host "SUCCESS: Traffic safely reverted to $stableRev and verified Healthy with all 4 dependencies."
          } else {
            Write-Host "CRITICAL DATA CORRUPTION SHIELD (PBI11): Schema compatibility check failed (Exit $checkExit)."
            Write-Host "Aborting ANY traffic reversal to prior revision '$stableRev' to prevent severe data corruption."
            Write-Host "Quarantining failed canary revision by deactivating candidate revision..."
            az containerapp revision deactivate --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev"
            $deactExit = $LASTEXITCODE
            $deactActive = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$canaryRev" --query "properties.active" -o tsv 2>$null
            $showExit = $LASTEXITCODE
            $deactOk = ($deactExit -eq 0 -and $showExit -eq 0 -and $deactActive -eq "false")
            Write-Host "Candidate deactivation confirmed: active=$deactActive (Ok=$deactOk, deactExit=$deactExit, showExit=$showExit)"

            # Avalia e confirma estado real de tráfego e atividade da revisão estável após isolar a candidata
            $stableActiveQuery = az containerapp revision show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" --revision "$stableRev" --query "properties.active" -o tsv 2>$null
            $stableActiveExit = $LASTEXITCODE
            $stableActiveStatus = if ($stableActiveExit -eq 0 -and $stableActiveQuery -eq "true") {
              "ACTIVE"
            } elseif ($stableActiveExit -eq 0 -and $stableActiveQuery -eq "false") {
              "INACTIVE"
            } else {
              "QUERY_FAILED"
            }

            $postTrafficJson = az containerapp ingress traffic show --name "app-pix-worker-prod" --resource-group "rg-lab-observabilidade" -o json 2>$null
            $postTrafficExit = $LASTEXITCODE
            $stableWeightPost = -1
            if ($postTrafficExit -eq 0 -and -not [string]::IsNullOrWhiteSpace($postTrafficJson)) {
              try {
                $postTrafficList = $postTrafficJson | ConvertFrom-Json
                $stablePostObj = $postTrafficList | Where-Object { $_.revisionName -eq $stableRev }
                $stableWeightPost = if ($stablePostObj) { [int]$stablePostObj.weight } else { 0 }
              } catch {
                $stableWeightPost = -1
              }
            }

            $exposedStatus = if ($stableWeightPost -lt 0) { "UNKNOWN" } elseif ($stableWeightPost -gt 0) { "TRUE" } else { "FALSE" }

            $contingencyRecord = [PSCustomObject]@{
              phase                                   = "FailedClosed"
              reason                                  = "SchemaIncompatibilityPreventsRollback"
              priorStableRevision                     = $stableRev
              stableActiveStatus                      = $stableActiveStatus
              stableTrafficWeight                     = $stableWeightPost
              isolatedCandidate                       = $canaryRev
              candidateDeactivated                    = $deactOk
              candidateDeactivateExit                 = $deactExit
              candidateShowExit                       = $showExit
              stableActiveExit                        = $stableActiveExit
              trafficQueryExit                        = $postTrafficExit
              stableTrafficExposedToIncompatibleSchema = $exposedStatus
              environment                             = "production"
              timestamp                               = [System.DateTimeOffset]::UtcNow.ToString("o")
              reconciliationState                     = "INCIDENT_OPEN"
              recommendedAction                       = "EMERGENCY_FIX_FORWARD_REQUIRED_PREVENT_TRANSACTION_CORRUPTION"
            }

            $contingencyRecord | ConvertTo-Json -Depth 5 | Set-Content -Path "emergency-incident-reconciliation.json" -Encoding UTF8
            az keyvault secret set --vault-name "kv-pixlab-prod-c4vrp5pjw" --name "DeploymentState" --value ($contingencyRecord | ConvertTo-Json -Compress)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL_RECORD_FAILURE: Failed to persist contingency record in Key Vault (Exit $LASTEXITCODE)! Local emergency evidence preserved at emergency-incident-reconciliation.json."
            }
            if (-not $deactOk) {
              Write-Error "CRITICAL: Candidate revision '$canaryRev' could NOT be confirmed inactive! SRE immediate manual intervention required."
              exit 1
            }

            Write-Error "CONTINGENCY ACTIVATED: Automatic rollback strictly prohibited due to schema incompatibility. Candidate revision isolated. Engineering hotfix required immediately."
            exit 2
          }

      - name: Upload Emergency Incident Evidence Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: prod-emergency-incident
          path: emergency-incident-reconciliation.json
          if-no-files-found: ignore
          retention-days: 90
