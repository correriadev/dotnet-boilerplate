version: '3.8'

services:
  redis:
    image: redis:7-alpine@sha256:c0ef6a12a0e2ec6f296803e64b85c1844b2faec1f2f38d38bf42f62788d4c9d9
    container_name: pix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:3d38769352e82e3c0fcfcb76ef77be32faeb2c0b0fb649e3557cf185d85207c4
    container_name: pix-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest@sha256:e647b0e1183cf134bb8846c7dc8bb5359a68bc0661fffeefb4bb0bf38f4d8a57
    container_name: pix-servicebus-emulator
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: "mssql"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
      CONFIG_PATH: "/ServiceBus-Emulator/ConfigFiles/Config.json"
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus-Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
    depends_on:
      mssql:
        condition: service_healthy

  cashout-api:
    build:
      context: .
      dockerfile: src/Pix.CashOut.Api/Dockerfile
    container_name: pix-cashout-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=mssql;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__ServiceBus=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-api:
    build:
      context: .
      dockerfile: src/Pix.Payment.Api/Dockerfile
    container_name: pix-payment-api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=mssql;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__ServiceBus=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbank-connector:
    build:
      context: .
      dockerfile: src/Outbank.Connector/Dockerfile
    container_name: pix-outbank-connector
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=mssql;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__ServiceBus=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      mssql:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started

  reconciliation-worker:
    build:
      context: .
      dockerfile: src/Pix.Reconciliation.Worker/Dockerfile
    container_name: pix-reconciliation-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=mssql;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__ServiceBus=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      mssql:
        condition: service_healthy

  webhook-dispatcher:
    build:
      context: .
      dockerfile: src/Webhook.Dispatcher/Dockerfile
    container_name: pix-webhook-dispatcher
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=mssql;Database=pix_processing;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__ServiceBus=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      mssql:
        condition: service_healthy

  pix-gateway:
    build:
      context: .
      dockerfile: src/Pix.Gateway/Dockerfile
    container_name: pix-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__cashout-cluster__Destinations__cashout-api__Address=http://cashout-api:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__payment-api__Address=http://payment-api:8080
    depends_on:
      cashout-api:
        condition: service_started
      payment-api:
        condition: service_started
